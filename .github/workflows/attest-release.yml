name: attest-release

# Signs a statement, through GitHub's Sigstore attestations, that a published
# release's assets are the ones its gates.json qualified. It builds nothing: the
# predicate records the release, tag commit, qualification report and the tier of
# each release target, not build provenance. The packages are built on
# GitHub-hosted runners in the release candidate run and qualified on the release
# host, which requires its own Linux x86-64 build to be byte-identical to CI's
# (docs/RELEASE_CHECKS.md).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attest
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    # Only the workflow as merged on main may sign; a branch cannot bring its own.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      # The checks come from main, like this workflow (scripts/check-release-assets.sh).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: checks
          persist-credentials: false
      - name: Download and check release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D assets
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          # Every asset listed once in SHA256SUMS with matching bytes; gates.json qualifies the
          # tagged commit (every gate of every release target passed, clean checker); the
          # inventories are the qualified ones, packaged from that commit, every artifact they
          # list published with its hash, the native platforms exactly the qualified targets;
          # nothing else.
          checks/scripts/check-release-assets.sh assets "$commit"
          jq -n --arg tag "$TAG" --arg commit "$commit" --arg gates "$(sha256sum assets/gates.json | cut -d' ' -f1)" \
            --arg repo "$GITHUB_REPOSITORY" --argjson targets "$(jq -c '(.targets // {}) | map_values(.tier)' assets/gates.json)" \
            '{release: $tag, repository: $repo, source_commit: $commit, gates_sha256: $gates, release_ready: true, targets: $targets}' > predicate.json
          grep -v ' gates.json$' assets/SHA256SUMS > subjects.txt
          cat predicate.json subjects.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: subjects.txt
          predicate-type: https://github.com/adrian729/ducktape-laya/release-qualification/v1
          predicate-path: predicate.json
