name: Other platforms
# Platform plan phase 1: native build and model-free tests on platforms other
# than Linux. Not a release gate yet.
on:
  workflow_dispatch:
    inputs:
      real_model:
        description: Download the pinned test model and run the real-model checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  macos:
    name: macOS arm64 / ${{ inputs.real_model && 'real model' || 'model free' }}
    if: false
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DUCKTAPE_LAYA_LIB_DIR: ${{ github.workspace }}/build
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/build
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
      - name: Download and verify explicitly requested test model
        if: inputs.real_model
        run: |
          mkdir -p build-model
          python3 - <<'PY'
          import json, pathlib, urllib.request
          model = json.loads(pathlib.Path('models/manifest.json').read_text())
          urllib.request.urlretrieve(model['url'], 'build-model/laya.gguf')
          PY
          python3 scripts/verify-model.py build-model/laya.gguf
          echo "LAYA_MODEL=$PWD/build-model/laya.gguf" >> "$GITHUB_ENV"
      - name: Build the library, Node addon and native tests
        run: |
          node_include="$(dirname "$(dirname "$(which node)")")/include/node"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUCKTAPE_BUILD_NODE=ON "-DNODE_INCLUDE_DIR=$node_include" \
            ${LAYA_MODEL:+"-DDUCKTAPE_TEST_MODEL=$LAYA_MODEL" -DDUCKTAPE_BUILD_REFERENCE_PROBE=ON}
          cmake --build build --parallel 3
      - name: Exported symbols
        run: nm -gU build/libducktape_laya.dylib | awk '{print $3}' | sort | tee build/exports.txt && diff build/exports.txt <(sort src/exports.macos)
      - name: Native tests
        run: ctest --test-dir build --output-on-failure
      - name: Agreement with the original Laya and with llama.cpp
        if: inputs.real_model
        run: |
          python3 tests/original-reference.py "$LAYA_MODEL" --build-dir build --report build/original-reference.json
          python3 tests/compare-native-reference.py "$LAYA_MODEL" --build build --report build/upstream-reference.json
      - name: Python
        run: PYTHONPATH=bindings/python/src python3 -m unittest discover -s bindings/python/tests
      - name: Rust
        run: cargo test --locked --manifest-path bindings/rust/Cargo.toml
      - name: Go
        run: CGO_CFLAGS="-I$PWD/include" CGO_LDFLAGS="-L$PWD/build" go -C bindings/go test -count=1 ./...
      - name: Java
        run: bash bindings/java/build.sh
      - name: .NET
        run: dotnet test bindings/dotnet/DucktapeLaya.slnx -m:1
      - name: Node
        run: DUCKTAPE_LAYA_ADDON="$PWD/build/ducktape_laya.node" node --test bindings/node/test.cjs
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-${{ inputs.real_model && 'real-model' || 'model-free' }}
          path: |
            build/original-reference.json
            build/original-reference-probe.json
            build/original-reference-erff.json
            build/upstream-reference.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows x64 / ${{ inputs.real_model && 'real model' || 'model free' }}
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DUCKTAPE_LAYA_LIB_DIR: ${{ github.workspace }}\build
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # The test and release scripts read UTF-8 files with Python's default encoding.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
      - name: Download and verify explicitly requested test model
        if: inputs.real_model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-model | Out-Null
          python -c "import json, pathlib, urllib.request; m = json.loads(pathlib.Path('models/manifest.json').read_text()); urllib.request.urlretrieve(m['url'], 'build-model/laya.gguf')"
          python scripts/verify-model.py build-model/laya.gguf
          if ($LASTEXITCODE) { exit 1 }
          "LAYA_MODEL=$((Resolve-Path build-model/laya.gguf).Path.Replace('\', '/'))" >> $env:GITHUB_ENV
      - name: Runner CPU
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Format-List Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors
          python -c "import platform; print(platform.platform())"
      - name: Build baseline and libm-probe variants with clang-cl
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "CLANG=%VS%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
          "%CLANG%" --version
          echo int main(void){return 0;} > arch-probe.c
          "%CLANG%" /O2 /arch:AVX2 -### -c arch-probe.c 2>&1 | findstr /c:"target-cpu"
          set "EXTRA=-DDUCKTAPE_TEST_MODEL=%LAYA_MODEL% -DDUCKTAPE_BUILD_REFERENCE_PROBE=ON"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=%CLANG%" "-DCMAKE_CXX_COMPILER=%CLANG%" -DDUCKTAPE_BUILD_NODE=OFF "-DDTL_PATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" %EXTRA% || exit /b 1
          cmake --build build --parallel 3 || exit /b 1
          cmake -S . -B build-probe -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=%CLANG%" "-DCMAKE_CXX_COMPILER=%CLANG%" -DDUCKTAPE_BUILD_NODE=OFF "-DDTL_PATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" -DDTL_LIBM_PROBE=ON %EXTRA% || exit /b 1
          cmake --build build-probe --parallel 3 --target laya-conformance-c || exit /b 1
          cmake -S . -B build-erff -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=%CLANG%" "-DCMAKE_CXX_COMPILER=%CLANG%" -DDUCKTAPE_BUILD_NODE=OFF "-DDTL_PATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" -DDTL_LIBM_PROBE=ON -DDTL_LIBM_PROBE_ERFF_ONLY=ON %EXTRA% || exit /b 1
          cmake --build build-erff --parallel 3 --target laya-conformance-c || exit /b 1
          echo == ggml-cpu compile command
          ninja -C build -t commands laya-conformance-c | findstr /c:"ops.cpp"
          echo == baseline imports
          dumpbin /imports build\ducktape_laya.dll | findstr /r /c:" erff$" /c:" expf$" /c:" sinf$" /c:" cosf$" /c:" powf$" /c:" logf$" /c:" tanhf$"
          echo == erff-only imports
          dumpbin /imports build-erff\ducktape_laya.dll | findstr /r /c:" erff$" /c:" expf$" /c:" sinf$" /c:" cosf$" /c:" powf$" /c:" logf$" /c:" tanhf$"
          echo == probe imports
          dumpbin /imports build-probe\ducktape_laya.dll | findstr /r /c:" erff$" /c:" expf$" /c:" sinf$" /c:" cosf$" /c:" powf$" /c:" logf$" /c:" tanhf$"
          exit /b 0
      - name: Numerical profile
        shell: pwsh
        run: |
          $env:PYTHONPATH = "bindings/python/src"
          python -c "import json, ducktape_laya; print(json.dumps(ducktape_laya.runtime_info(), indent=1))"
      - name: Agreement with the original Laya, baseline and libm probe
        if: inputs.real_model
        shell: pwsh
        run: |
          python tests/original-reference.py $env:LAYA_MODEL --build-dir build --report build/original-reference.json
          python tests/original-reference.py $env:LAYA_MODEL --build-dir build-probe --report build/original-reference-probe.json
          python tests/original-reference.py $env:LAYA_MODEL --build-dir build-erff --report build/original-reference-erff.json
          exit 0
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-${{ inputs.real_model && 'real-model' || 'model-free' }}
          path: |
            build/original-reference.json
            build/original-reference-probe.json
            build/upstream-reference.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
