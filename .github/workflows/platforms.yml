name: Other platforms
# Platform plan phases 1 to 3 for macOS arm64: native build, model-free tests and
# the macOS packages, and the real-model checks on dispatch. Not a release gate
# yet. Linux and Windows are in native.yml.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_model:
        description: Download the pinned test model and run the real-model checks
        type: boolean
        default: false
permissions:
  contents: read
# As in native.yml: a newer push to the same branch cancels the older push run; runs on main,
# pull requests and dispatches are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
jobs:
  # Documentation-only changes skip the build (scripts/ci-changes.py; native.yml runs the docs checks).
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then base="$BEFORE"
          elif [ "$EVENT" = push ]; then base="$(git merge-base origin/main HEAD || true)"
          fi
          python3 scripts/ci-changes.py --event "$EVENT" --base "$base"

  macos:
    name: macOS arm64 / ${{ inputs.real_model && 'real model' || 'model free' }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DUCKTAPE_LAYA_LIB_DIR: ${{ github.workspace }}/build
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/build
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GOTOOLCHAIN: local
      # ccache checks the compiler by content and has no base_dir (it would change the objects'
      # bytes; see native.yml).
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ runner.os }}-arm64-appleclang-${{ hashFiles('release/compatibility.json', '.gitmodules') }}
          restore-keys: ${{ runner.os }}-arm64-appleclang
          max-size: 500M
          install: binary
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Exact: javadoc output changes between patch releases, and every platform's
          # javadoc and classes must be the same for scripts/assemble-packages.py.
          java-version: '25.0.4'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install pinned Rust toolchain and fetch locked dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
          cargo fetch --locked --manifest-path tests/consumers/rust/Cargo.toml
      - name: Download and verify explicitly requested test model
        if: inputs.real_model
        run: |
          mkdir -p build-model
          python3 - <<'PY'
          import json, pathlib, urllib.request
          model = json.loads(pathlib.Path('models/manifest.json').read_text())
          urllib.request.urlretrieve(model['url'], 'build-model/laya.gguf')
          PY
          python3 scripts/verify-model.py build-model/laya.gguf
          echo "LAYA_MODEL=$PWD/build-model/laya.gguf" >> "$GITHUB_ENV"
      - name: Build the library, Node addon and native tests
        run: |
          node_include="$(dirname "$(dirname "$(which node)")")/include/node"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDUCKTAPE_BUILD_NODE=ON "-DNODE_INCLUDE_DIR=$node_include" \
            -DGGML_CCACHE=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${LAYA_MODEL:+"-DDUCKTAPE_TEST_MODEL=$LAYA_MODEL" -DDUCKTAPE_BUILD_REFERENCE_PROBE=ON}
          cmake --build build --parallel 3
      - name: Exported symbols
        run: nm -gU build/libducktape_laya.dylib | awk '{print $3}' | sort | tee build/exports.txt && diff build/exports.txt <(sort src/exports.macos)
      - name: Native tests
        run: ctest --test-dir build --output-on-failure
      - name: Agreement with the original Laya and with llama.cpp
        if: inputs.real_model
        run: |
          python3 tests/original-reference.py "$LAYA_MODEL" --build-dir build --report build/original-reference.json
          python3 tests/compare-native-reference.py "$LAYA_MODEL" --build build --report build/upstream-reference.json
      - name: Python
        run: PYTHONPATH=bindings/python/src python3 -m unittest discover -s bindings/python/tests
      - name: Rust
        run: cargo test --locked --manifest-path bindings/rust/Cargo.toml
      - name: Go
        run: CGO_CFLAGS="-I$PWD/include" CGO_LDFLAGS="-L$PWD/build" go -C bindings/go test -count=1 ./...
      - name: Java
        run: bash bindings/java/build.sh
      - name: .NET
        run: dotnet test bindings/dotnet/DucktapeLaya.slnx -m:1
      - name: Node
        run: DUCKTAPE_LAYA_ADDON="$PWD/build/ducktape_laya.node" node --test bindings/node/test.cjs
      - name: Packages (tarball, npm, crates, wheel, jar, NuGet), loaded outside the checkout
        run: |
          python3 scripts/package-native.py --build build --output build/packages
          python3 tests/package-smoke.py build/packages
      - name: Installed packages with the real model
        if: inputs.real_model
        run: python3 tests/installed-packages.py build/packages "$LAYA_MODEL"
      - name: Retain this platform's packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-macos-arm64
          path: build/packages/
          if-no-files-found: error
          retention-days: 14
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-${{ inputs.real_model && 'real-model' || 'model-free' }}
          path: |
            build/original-reference.json
            build/upstream-reference.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
