name: Native checks
# The release targets: Linux x86-64 (gcc, and clang pinned to LLVM 22.1.8), Linux arm64,
# Windows x64, macOS arm64 and macOS x86-64 (Apple clang, Xcode pinned), the multi-platform packages
# assembled from their fragments, sanitizers, fuzz, reproducibility and every dispatch mode.
#
# The `changes` job decides what runs (scripts/ci-changes.py with scripts/ci_paths.py): a job runs
# when its name is in the `run` output. Every job other than `changes` therefore has
#   if: !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), '<name>')
# so a needed job skipped as not stale does not skip its dependants. A job's `name:` is its
# verification unit (scripts/ci_paths.py JOBS); tests/ci-contracts.py compares the names and the
# `needs:` edges of each profile with JOBS.
#
# - Branch push: `changes`, `policy` with the stale policy checks and `generic-linux-x64` when stale.
# - Push to main or a merge commit: the whole push profile, unless the tree is identical to a fully
#   verified one (skip_all), or differs from one only by documentation that no job but the policy
#   checks reads (then only `policy`, with the checks of those docs).
# - Dispatch (scripts/verify.py, a release): mode verify (scope affected, all or a job list; with
#   real_model the real-model profile too), candidate (everything, the release evidence that
#   scripts/fetch-ci-evidence.py downloads), qualify (sanitizers, the fuzz campaign and the runtime
#   upgrade rehearsal), warm-cache (build-only cache seeds, then cache-prune), experiment.
#   cache=off builds without a compiler cache.
# - Schedule: nightly warm-cache (always, so main's caches never age out); weekly the full
#   push and real-model profiles (drift check of runner images and toolchains).
#
# A release dispatches mode=candidate first and mode=qualify once the candidate's build-* jobs have
# finished, so the candidate's shards get the runners first (docs/RELEASING.md).
#
# Artifacts kept as release evidence (30 days in a candidate run): evidence-<platform>,
# native-x64-<compiler>-node-<version>, packages-<platform>, packages-assembled,
# installed-<platform>-real-model, stress-<platform> and reproducibility-<platform>; in a qualify
# run sanitizers, fuzz and upgrade. Internal: build-<platform> (the build tarball) and
# shard.<platform>.<checks>, 7 days, so a failed shard can be rerun within the week. The dots keep
# one platform's shards apart from another's whose name extends it (linux-x64, linux-x64-clang).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Native checks mode={0} scope={1} real_model={2} cache={3}', inputs.mode, inputs.scope, inputs.real_model, inputs.cache)
      || github.event_name == 'schedule'
      && format('Native checks {0}', github.event.schedule == '17 3 * * *' && 'nightly warm-cache' || 'weekly full run')
      || '' }}
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *' # nightly: mode warm-cache
    - cron: '41 4 * * 6' # weekly: scope all with the real model
  workflow_dispatch:
    inputs:
      mode:
        description: verify (stale or selected jobs), candidate (release evidence), qualify (CI long gates), warm-cache (cache seeds), experiment
        type: choice
        options: [verify, candidate, qualify, warm-cache, experiment]
        default: verify
      scope:
        description: affected (the stale jobs), all, or a comma-separated list of job names
        type: string
        default: affected
      real_model:
        description: Also the real-model profile (mode verify)
        type: boolean
        default: false
      cache:
        description: auto, or off to build every job of the run without a compiler cache
        type: choice
        options: [auto, 'off']
        default: auto
      runtime:
        description: mode qualify (required), the runtime commit qualify-upgrade rehearses; it must differ from the pin, because the upgrade_rollback gate requires a rehearsed runtime axis (the plan step refuses the pin or no value in seconds)
        type: string
        default: ''
      replay_baseline:
        description: mode qualify, rehearse the pin against itself (a baseline replay, never release evidence); the only way to run qualify-upgrade without a runtime other than the pin
        type: boolean
        default: false
      fuzz_seconds:
        description: mode qualify, length of the qualify-fuzz campaign
        type: number
        default: 3600
permissions:
  contents: read
  actions: read
# A newer push to the same branch cancels the older push run (each push's `changes` computes its own
# stale jobs from job records). Runs on main, pull requests, dispatches and schedules are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
defaults:
  run:
    shell: bash
# Compiler cache (docs/RELEASE_CHECKS.md): ccache checks the compiler by content, has no base_dir (it
# would hand the compiler relative paths, which -ffile-prefix-map does not map, and change the
# objects' bytes) and no sloppiness. The scripts set the same and record `ccache --show-config`.
env:
  CCACHE_COMPILERCHECK: content
  CCACHE_BASEDIR: ''
  CCACHE_SLOPPINESS: ''
  PY: python3
  PYTHONUTF8: '1'
  # Git Bash on Windows: never rewrite arguments such as /O2 into Windows paths.
  MSYS_NO_PATHCONV: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  GOTOOLCHAIN: local
jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.inputs.outputs.mode }}
      cache: ${{ steps.inputs.outputs.cache }}
      real_model: ${{ steps.inputs.outputs.real_model }}
      skip_all: ${{ steps.changes.outputs.skip_all }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
      policy: ${{ steps.plan.outputs.policy }}
      base_policy: ${{ steps.changes.outputs.base_policy }}
      runtime: ${{ steps.plan.outputs.runtime }}
      bindings_linux_x64: ${{ steps.plan.outputs.bindings_linux_x64 }}
      bindings_windows_x64: ${{ steps.plan.outputs.bindings_windows_x64 }}
      assembled: ${{ steps.plan.outputs.assembled }}
      shards_linux_x64: ${{ steps.plan.outputs.shards_linux_x64 }}
      shards_linux_x64_clang: ${{ steps.plan.outputs.shards_linux_x64_clang }}
      shards_linux_arm64: ${{ steps.plan.outputs.shards_linux_arm64 }}
      shards_windows_x64: ${{ steps.plan.outputs.shards_windows_x64 }}
      shards_macos_arm64: ${{ steps.plan.outputs.shards_macos_arm64 }}
      shards_macos_x64: ${{ steps.plan.outputs.shards_macos_x64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Schedules have no inputs: the nightly cron is the warm-cache seeder, the weekly one the full run.
      - name: Mode, scope and cache of this run
        id: inputs
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_SCOPE: ${{ inputs.scope }}
          IN_REAL_MODEL: ${{ inputs.real_model }}
          IN_CACHE: ${{ inputs.cache }}
        run: |
          case "$EVENT" in
            workflow_dispatch) mode=$IN_MODE scope=$IN_SCOPE real_model=$IN_REAL_MODEL cache=$IN_CACHE ;;
            schedule)
              if [ "$SCHEDULE" = '17 3 * * *' ]; then mode=warm-cache real_model=false
              else mode=verify real_model=true
              fi
              scope=all cache=auto ;;
            *) mode=verify scope=affected real_model=false cache=auto ;;
          esac
          case "$mode" in verify|candidate|qualify|warm-cache|experiment) ;; *) echo "unknown mode $mode" >&2; exit 1 ;; esac
          case "$cache" in auto|off) ;; *) echo "unknown cache $cache" >&2; exit 1 ;; esac
          if ! printf '%s' "$scope" | grep -Eq '^[a-z0-9][a-z0-9,-]*$'; then echo "invalid scope $scope" >&2; exit 1; fi
          { echo "mode=$mode"; echo "scope=$scope"; echo "real_model=$real_model"; echo "cache=$cache"; } | tee -a "$GITHUB_OUTPUT"
      # Per-job staleness from the jobs' last trusted successes (push, schedule and dispatch runs on
      # an ancestor, never pull_request runs), the identical-tree skip and the run-set closure; any
      # API or git failure marks every job stale. Outputs run, skip_all, base_<job>, docs_only.
      - name: Stale jobs
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ steps.inputs.outputs.mode }}
          SCOPE: ${{ steps.inputs.outputs.scope }}
          REAL_MODEL: ${{ steps.inputs.outputs.real_model }}
        run: >-
          python3 scripts/ci-changes.py --workflow native.yml --repository "$GITHUB_REPOSITORY"
          --event "$EVENT" --ref "$GITHUB_REF" --head "$GITHUB_SHA"
          --mode "$MODE" --scope "$SCOPE" --real-model "$REAL_MODEL"
      # The matrices of the jobs whose names come from data: the binding jobs, the assembled jobs and
      # the real-model and candidate shards (scripts/ci_paths.py SHARDS, so rebalancing the shards
      # needs no workflow edit), each filtered to the jobs in `run`.
      - name: Job matrices
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ steps.inputs.outputs.mode }}
          SCOPE: ${{ steps.inputs.outputs.scope }}
          RUN: ${{ steps.changes.outputs.run }}
          SKIP_ALL: ${{ steps.changes.outputs.skip_all }}
          DOCS_ONLY: ${{ steps.changes.outputs.docs_only }}
          RUNTIME: ${{ inputs.runtime }}
          REPLAY_BASELINE: ${{ inputs.replay_baseline }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          sys.path.insert(0, 'scripts')
          import ci_paths

          mode, event, scope = os.environ['MODE'], os.environ['EVENT'], os.environ['SCOPE']
          run = [] if os.environ.get('SKIP_ALL') == 'true' else json.loads(os.environ['RUN'] or '[]')
          if not isinstance(run, list) or not all(isinstance(name, str) for name in run):
              raise SystemExit(f'ci-changes: run is not a list of job names: {run!r}')
          outputs = {'run': run}

          def matrix(name, entries):
              outputs[name] = entries
              print(f'{name}: {[entry.get("job", entry) for entry in entries]}')

          # Binding jobs: one per language whose binding-<lang>-<platform> job runs (macOS: one job per architecture, no matrix).
          for platform in ('linux-x64', 'windows-x64'):
              langs = sorted(m[1] for m in (re.fullmatch(rf'binding-([a-z]+)-{platform}', job) for job in run) if m)
              matrix('bindings_' + platform.replace('-', '_'), [{'job': f'binding-{lang}-{platform}', 'lang': lang} for lang in langs])
          runners = {'linux-x64': ('ubuntu-24.04', 'python3', 'bash'), 'linux-arm64': ('ubuntu-24.04-arm', 'python3', 'bash'),
                     # PowerShell on Windows: Strawberry Perl's pkg-config.bat does not run from Git Bash.
                     'windows-x64': ('windows-2025', 'python', 'pwsh'),
                     'macos-arm64': ('macos-15', 'python3', 'bash'), 'macos-x64': ('macos-15-intel', 'python3', 'bash')}
          matrix('assembled', [{'job': f'assembled-{platform}', 'platform': platform, 'runner': runner, 'python': python, 'shell': shell}
                               for platform, (runner, python, shell) in runners.items() if f'assembled-{platform}' in run])

          # Shards: the candidate mode's SHARDS in a candidate run, the real-model mode's otherwise.
          # packages-<platform> is a workflow job of its own (assemble starts as soon as it ends).
          # Toolchains per check; an unknown check gets all of them.
          everything = ['rust', 'java', 'dotnet', 'go', 'typescript']
          tools = {'ctest': [], 'references': [], 'parity:smoke': ['rust', 'java', 'dotnet', 'go'], 'parity:full-a': ['rust'],
                   'parity:full-b': ['java', 'dotnet', 'go'], 'parity:smoke-a': ['rust'], 'parity:smoke-b': ['java', 'dotnet', 'go'],
                   'bindings': ['rust', 'java', 'dotnet', 'go'], 'bindings:a': ['rust'], 'bindings:b': ['java', 'dotnet', 'go'],
                   'packages': ['rust', 'java', 'dotnet', 'go'], 'policy-platform': ['typescript']}
          shard_mode = 'candidate' if mode == 'candidate' else 'real_model'
          for platform in ('linux-x64', 'linux-x64-clang', 'linux-arm64', 'windows-x64', 'macos-arm64', 'macos-x64'):
              table = ci_paths.SHARDS.get(shard_mode, {}).get(platform, {})
              side = table.get('side_outputs', {})
              entries = []
              for job, checks in table.get('jobs', {}).items():
                  if job == f'packages-{platform}' or job not in run:
                      continue
                  needed = sorted({tool for check in checks for tool in tools.get(check, everything)})
                  entries.append({'job': job, 'checks': ','.join(checks),
                                  'label': '+'.join(check.replace(':', '-') for check in checks),
                                  'tools': ','.join(needed),
                                  'qemu': 'ctest' in checks and platform.startswith('linux-x64'),
                                  'cross_host': 'cross-host' in side.get(job, [])})
              matrix('shards_' + platform.replace('-', '_'), entries)

          # The policy job runs the stale policy checks on a branch push, a pull request, an affected verify
          # dispatch and a docs-only push to main (its docs against the verified tree; an unknown base means
          # every check); every policy check otherwise (main, merges, schedules, scope all or a list).
          parents = subprocess.run(['git', 'rev-list', '--parents', '-n', '1', 'HEAD'], capture_output=True, text=True).stdout.split()
          branch_push = event == 'push' and os.environ['GITHUB_REF'] != 'refs/heads/main' and len(parents) == 2
          stale = branch_push or event == 'pull_request' or (event == 'workflow_dispatch' and scope == 'affected') \
              or (event == 'push' and os.environ.get('DOCS_ONLY') == 'true')
          outputs['policy'] = 'stale' if stale else 'all'

          # qualify-upgrade: the requested runtime commit. A release needs one other than the pin (check-candidate.py
          # upgrade_rollback: candidate_runtime != baseline_runtime): the 0.3.0 qualify run rehearsed the pin against itself,
          # found only after 61 minutes of CI and 3.5 hours of host qualification. Refuse here, in seconds.
          pinned = json.load(open('release/compatibility.json'))['runtime']['commit']
          runtime = os.environ.get('RUNTIME') or ''
          replay = os.environ.get('REPLAY_BASELINE') == 'true'
          if mode == 'qualify' and 'qualify-upgrade' in run and not replay:
              if not runtime:
                  raise SystemExit('mode=qualify needs -f runtime=COMMIT, the runtime commit qualify-upgrade rehearses (a recent upstream '
                                   'llama.cpp revision past the pin on which every runtime patch applies: docs/RELEASING.md step 2). '
                                   'To replay the pin against itself on purpose, pass -f replay_baseline=true.')
              if runtime == pinned:
                  raise SystemExit(f'runtime {runtime} is the pinned runtime: the upgrade_rollback gate requires a rehearsed runtime '
                                   'other than the pin. Pass -f runtime=COMMIT past the pin, or -f replay_baseline=true to replay the baseline on purpose.')
          runtime = runtime or pinned
          if not re.fullmatch(r'[0-9a-f]{40}', runtime):
              raise SystemExit(f'runtime must be a full commit hash, not {runtime!r}')
          outputs['runtime'] = runtime

          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              for key, value in outputs.items():
                  stream.write(f'{key}={value if isinstance(value, str) else json.dumps(value)}\n')
          print(f'mode {mode}, {len(run)} jobs: {", ".join(run) or "none"}')
          PY

  # ---------------------------------------------------------------- push profile

  policy:
    name: policy
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'policy') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DTL_JOB: policy
      DTL_NODE: 26.7.0
      DTL_TOOLS: typescript
    steps:
      # Full history for the policy base; the runtime submodule at depth 1 only, because
      # release_support.check_record (validate.py, check-candidate.py and their tests) requires the
      # pinned runtime checkout. checkout's submodules option would fetch its whole history here.
      - &checkout-plain
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - &runtime-shallow
        name: Pinned runtime checkout (depth 1)
        run: git submodule update --init --depth 1 third_party/llama.cpp
      - &setup-node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: env.DTL_NODE != ''
        with:
          node-version: ${{ env.DTL_NODE }}
      - &typescript
        name: Install locked TypeScript consumer test tools
        if: contains(format(',{0},', env.DTL_TOOLS), ',typescript,')
        run: npm ci --ignore-scripts --prefix tests/typescript
      # --stale selects the checks whose inputs changed since this job's last trusted success
      # (scripts/ci-changes.py's base_policy; empty when there is none, then every check runs).
      - name: Policy checks
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION: ${{ needs.changes.outputs.policy }}
          CI_POLICY_BASE: ${{ needs.changes.outputs.base_policy }}
        run: python3 scripts/check-policy.py "--$SELECTION" --jobs 4 --output build-ci-report
      - &report
        name: Retain the report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-${{ env.DTL_JOB }}
          path: |
            build-ci-report/
            !build-ci-report/packages/
            !build-ci-report/assembled/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  generic-linux-x64:
    name: generic-linux-x64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'generic-linux-x64') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DTL_JOB: generic-linux-x64
      DTL_NODE: 26.7.0
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-gcc-generic
      DTL_CACHE_FALLBACK: |-
        linux-x64-gcc-warm
      DTL_CACHE_SAVE: 'true'
      CC: gcc
      CXX: g++
    steps:
      - &checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - &ninja
        uses: ./.github/actions/setup-ninja
      - &compiler-cache
        name: Compiler cache
        if: env.DTL_LAUNCHER != 'none'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          variant: ${{ env.DTL_LAUNCHER }}
          # ccache-<os>-<arch>-<compiler>-<config>-<role>-<pin hash>-<timestamp>; restored by prefix.
          # scripts/ci-cache-prune.py keeps the newest two per prefix and ref, so every job that
          # saves has its own DTL_CACHE_KEY (role generic, build, warm or push; no key extends
          # another, tests/ci-contracts.py): one job's saves never evict another's. A job first
          # restores its own key, then each DTL_CACHE_FALLBACK prefix (one per line) in order:
          # restore-only jobs name the producer of their configuration there.
          key: ${{ env.DTL_CACHE_KEY }}-${{ hashFiles('release/compatibility.json', '.gitmodules') }}
          restore-keys: |
            ${{ env.DTL_CACHE_KEY }}-${{ hashFiles('release/compatibility.json', '.gitmodules') }}
            ${{ env.DTL_CACHE_KEY }}
            ${{ env.DTL_CACHE_FALLBACK }}
          max-size: 500M
          save: ${{ env.DTL_CACHE_SAVE }}
          install: binary
          job-summary: ''
      - *setup-node
      # Generic: configure, build, the tier-generic tests, examples, ABI exports and the
      # binary constraints (scripts/check-binary.py) of the library and addon.
      - name: Generic validation
        run: python3 scripts/validate.py --output build-ci-report --jobs 4 --compiler-launcher "$DTL_LAUNCHER"
      - &cache-stats
        name: Compiler cache statistics
        if: always() && env.DTL_LAUNCHER != 'none'
        shell: bash
        run: |
          { echo "### $DTL_LAUNCHER -s ($DTL_JOB)"; echo '```'; "$DTL_LAUNCHER" -s || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - *report

  generic-linux-x64-clang:
    name: generic-linux-x64-clang
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'generic-linux-x64-clang') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DTL_JOB: generic-linux-x64-clang
      DTL_NODE: 24.21.0
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-clang-generic
      DTL_CACHE_FALLBACK: |-
        linux-x64-clang-warm
      DTL_CACHE_SAVE: 'true'
    steps:
      - *checkout
      - &llvm
        uses: ./.github/actions/setup-llvm
      - *ninja
      - *compiler-cache
      - *setup-node
      - name: Generic validation
        run: python3 scripts/validate.py --output build-ci-report --jobs 4 --compiler-launcher "$DTL_LAUNCHER"
      # After every other use of the build: reconfiguring recompiles nothing, and an edited patched
      # runtime copy is restored and recompiled alone.
      - name: Reconfigure without recompiling
        run: python3 tests/reconfigure.py --build build-validation --jobs 4 --edit-copy
      - *cache-stats
      - *report

  generic-linux-arm64:
    name: generic-linux-arm64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'generic-linux-arm64') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      DTL_JOB: generic-linux-arm64
      DTL_NODE: 24.21.0
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-arm64-gcc-generic
      DTL_CACHE_FALLBACK: |-
        linux-arm64-gcc-warm
      DTL_CACHE_SAVE: 'true'
      CC: gcc
      CXX: g++
    steps:
      - *checkout
      - *ninja
      - *compiler-cache
      - *setup-node
      - name: Generic validation
        run: python3 scripts/validate.py --output build-ci-report --jobs 4 --compiler-launcher "$DTL_LAUNCHER"
      - *cache-stats
      - *report

  generic-windows-x64:
    name: generic-windows-x64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'generic-windows-x64') }}
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DTL_JOB: generic-windows-x64
      DTL_NODE: 24.21.0
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'sccache' }}
      DTL_CACHE_KEY: windows-x64-clang-cl-generic
      DTL_CACHE_FALLBACK: |-
        windows-x64-clang-cl-warm
      DTL_CACHE_SAVE: 'true'
      PY: python
    steps:
      - &defender
        name: Windows Defender exclusion for the build directories and caches
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, "$env:LOCALAPPDATA\Mozilla\sccache",
                     "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup", "$env:USERPROFILE\.nuget", "$env:LOCALAPPDATA\go-build",
                     "$env:USERPROFILE\go")
          try { Add-MpPreference -ExclusionPath $paths -ErrorAction Stop; "Defender exclusions: $($paths -join ', ')" }
          catch { "Defender exclusion skipped (Defender passive or absent): $_" }
      - *checkout
      - *ninja
      - *compiler-cache
      - *setup-node
      - &node-sdk
        name: Node-API headers and node.lib for this Node, checked against its SHASUMS256.txt
        if: runner.os == 'Windows' && env.DTL_NODE != ''
        shell: bash
        run: python scripts/fetch-node-sdk.py build-node-sdk --lib | tr -d '\r' | tr '\134' '/' | tee -a "$GITHUB_ENV"
      # The Visual Studio x64 environment for the following steps, and the clang-cl arguments every
      # Windows scripts/validate.py run takes (one per line, for bash's mapfile). Git's patch.exe:
      # Strawberry Perl's comes first on PATH and crashes.
      - &vs-env
        name: Visual Studio x64 environment and clang-cl arguments
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $lines = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          if ($LASTEXITCODE) { exit 1 }
          $current = [Environment]::GetEnvironmentVariables()
          foreach ($line in $lines) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*)=(.*)$' -and $current[$Matches[1]] -ne $Matches[2] -and $Matches[1] -notmatch '^(GITHUB|RUNNER)_') {
              "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            }
          }
          $clang = "$vs\VC\Tools\Llvm\x64\bin\clang-cl.exe".Replace('\', '/')
          "DTL_CLANG_CL=$clang" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # Bash steps put Git's /usr/bin (with its own link.exe) ahead of MSVC on PATH, and rustc
          # in a Visual Studio environment runs the link.exe it finds there: name MSVC's linker.
          $tools = ($lines | Where-Object { $_ -match '^VCToolsInstallDir=' }) -replace '^VCToolsInstallDir=', ''
          $link = Join-Path $tools 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path $link)) { Write-Error "MSVC link.exe not found at $link"; exit 1 }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - &windows-args
        name: clang-cl arguments of scripts/validate.py
        if: runner.os == 'Windows'
        shell: bash
        run: |
          file="$(cygpath -u "$RUNNER_TEMP")/dtl-windows-args.txt"
          # The Node SDK only where the job builds the addon (a binding job of another language has none).
          node=()
          if [ -n "${NODE_INCLUDE_DIR:-}" ]; then node=("--node-include=$NODE_INCLUDE_DIR" "--node-lib=$NODE_LIB"); fi
          printf '%s\n' "${node[@]}" --cmake-arg=-GNinja \
            "--cmake-arg=-DCMAKE_C_COMPILER=$DTL_CLANG_CL" "--cmake-arg=-DCMAKE_CXX_COMPILER=$DTL_CLANG_CL" \
            '--cmake-arg=-DDTL_PATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe' > "$file"
          cat "$file"
          echo "DTL_WINDOWS_ARGS=$file" >> "$GITHUB_ENV"
      - name: Generic validation with clang-cl
        run: |
          mapfile -t windows < "$DTL_WINDOWS_ARGS"
          python scripts/validate.py --output build-ci-report --jobs 4 --compiler-launcher "$DTL_LAUNCHER" "${windows[@]}"
      # The platform policy checks whose Windows results differ from Linux: ABI layouts with clang
      # and the packaging identities with clang-cl (S2). The Linux policy job runs them too.
      - name: ABI layouts and packaging identities on Windows
        run: |
          # tests/abi-layout.py compiles with CC and CXX, which need a GNU-style driver: the clang
          # next to clang-cl (as scripts/validate.py's layout step chose before).
          clang="${DTL_CLANG_CL%clang-cl.exe}clang.exe"
          CC="$clang" CXX="${clang%clang.exe}clang++.exe" \
            python scripts/check-policy.py --only abi-layouts,packaging-identities --output build-ci-report/policy
      - *cache-stats
      - *report

