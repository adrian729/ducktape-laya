name: Native checks
# Linux x86-64 and arm64 and Windows x64 (scripts/validate.py on each), the
# multi-platform packages assembled from their fragments and installed on every
# platform, and build reproducibility.
#
# A release candidate run (dispatch with candidate=true on the exact candidate
# commit, see docs/RELEASE_CHECKS.md) also runs the tier-2 targets' short stress
# and reproducibility and keeps every target's evidence for
# scripts/fetch-ci-evidence.py: evidence-<platform> (validate.py report and
# outputs), packages-<platform> (fragments), packages-assembled (the release
# packages), installed-<platform>-real-model, stress-<platform> and
# reproducibility-<platform>.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_model:
        description: Download the pinned test model and run native artifact checks
        type: boolean
        default: false
      candidate:
        description: Release candidate run (implies the real model; adds the tier-2 stress and reproducibility evidence)
        type: boolean
        default: false
permissions:
  contents: read
# A newer push to the same branch cancels the older push run (scripts/ci-changes.py compares a
# branch with main, so the newer run checks everything the older one would have). Runs on main,
# pull requests and dispatches (candidate runs included) are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
# Compiler cache (non-candidate build jobs; see docs/RELEASE_CHECKS.md, Continuous integration):
# ccache checks the compiler by content, and has no base_dir: base_dir would hand the compiler
# relative paths, which -ffile-prefix-map does not map, and change the objects' bytes.
env:
  CCACHE_COMPILERCHECK: content
jobs:
  # Documentation-only changes skip the build jobs (scripts/ci-changes.py); a dispatch never does.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      library: ${{ steps.classify.outputs.library }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then base="$BEFORE"
          elif [ "$EVENT" = push ]; then base="$(git merge-base origin/main HEAD || true)"
          fi
          python3 scripts/ci-changes.py --event "$EVENT" --base "$base"

  docs:
    name: Documentation and policy checks
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Links, release notes, qualification policy, result comparison and the CI change rules
        run: |
          python3 tests/docs-links.py
          python3 tests/docs-links.py --self-test
          python3 tests/release-notes.py
          python3 tests/qualification.py
          python3 tests/result-comparison.py
          python3 tests/ci-changes.py

  parser-sanitizers:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Compiler cache
        if: ${{ !inputs.candidate }}
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ runner.os }}-x64-clang-sanitizers-${{ hashFiles('release/compatibility.json', '.gitmodules') }}
          restore-keys: ${{ runner.os }}-x64-clang-sanitizers
          max-size: 500M
          install: binary
      - name: Build instrumented shared library and model-free contracts
        env:
          LAUNCHER: ${{ !inputs.candidate && 'ccache' || '' }}
        run: |
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DGGML_CCACHE=OFF "-DCMAKE_C_COMPILER_LAUNCHER=$LAUNCHER" "-DCMAKE_CXX_COMPILER_LAUNCHER=$LAUNCHER"
          cmake --build build-sanitized --parallel 4
          ctest --test-dir build-sanitized --output-on-failure
      - name: Mutate request, schema and router inputs
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/input-fuzz.cpp -Iinclude -Lbuild-sanitized -lducktape_laya -o build-sanitized/input-fuzz
          LD_LIBRARY_PATH="$PWD/build-sanitized" build-sanitized/input-fuzz \
            tests/fixtures/primitive.json tests/fixtures/structured.json tests/fixtures/batch.json
      - name: Retain sanitizer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-sanitizers
          path: build-sanitized/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  # The libFuzzer smoke in its own job and build directory, in parallel with the sanitizer job.
  parser-fuzzer:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Compiler cache
        if: ${{ !inputs.candidate }}
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ runner.os }}-x64-clang-fuzzer-${{ hashFiles('release/compatibility.json', '.gitmodules') }}
          restore-keys: ${{ runner.os }}-x64-clang-fuzzer
          max-size: 500M
          install: binary
      - name: Coverage-guided parser and router smoke
        env:
          LAUNCHER: ${{ !inputs.candidate && 'ccache' || '' }}
        run: |
          cmake -S . -B build-fuzzer -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDUCKTAPE_BUILD_FUZZERS=ON -DDUCKTAPE_BUILD_TESTS=OFF \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DGGML_CCACHE=OFF "-DCMAKE_C_COMPILER_LAUNCHER=$LAUNCHER" "-DCMAKE_CXX_COMPILER_LAUNCHER=$LAUNCHER"
          cmake --build build-fuzzer --target laya-input-fuzzer --parallel 4
          python3 tests/fuzz-corpus.py build-fuzzer/corpus
          build-fuzzer/laya-input-fuzzer build-fuzzer/corpus -seed=444211238 \
            -max_total_time=60 -max_len=1048577 -timeout=30 \
            -artifact_prefix=build-fuzzer/fuzzer- -print_final_stats=1 \
            > build-fuzzer/fuzzer-smoke.log 2>&1
      - name: Retain fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-fuzzer
          path: build-fuzzer/fuzzer-*
          if-no-files-found: warn
          retention-days: 14

  native:
    name: ${{ matrix.compiler }} / Node ${{ matrix.node }} / ${{ matrix.arch }} / ${{ (inputs.real_model || inputs.candidate) && 'real model' || 'model free' }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            cc: clang
            cxx: clang++
            node: 24.21.0
            runner: ubuntu-24.04
            arch: x64
          # The release platform's fragment and evidence (gcc, the release compiler).
          - compiler: gcc
            cc: gcc
            cxx: g++
            node: 26.7.0
            runner: ubuntu-24.04
            arch: x64
            platform: linux-x64
          # Linux arm64: native build, ctest, every binding suite and per-platform
          # packages (linux-arm64 tarball, npm, wheel, jar, nupkg) with scripts/package-native.py.
          - compiler: gcc
            cc: gcc
            cxx: g++
            node: 24.21.0
            runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux-arm64
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # A candidate run builds without a compiler cache (scripts/check-candidate.py requires it).
      LAUNCHER: ${{ inputs.candidate && 'none' || 'ccache' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Compiler cache
        if: ${{ !inputs.candidate }}
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.compiler }}-${{ hashFiles('release/compatibility.json', '.gitmodules') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-${{ matrix.compiler }}
          max-size: 500M
          install: binary
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned Rust toolchain and fetch locked test dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
          cargo fetch --locked --manifest-path tests/consumers/rust/Cargo.toml
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Exact: javadoc output changes between patch releases, and every platform's
          # javadoc and classes must be the same for scripts/assemble-packages.py.
          java-version: '25.0.4'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install QEMU user mode for the emulated-CPU guard test
        if: (inputs.real_model || inputs.candidate) && matrix.arch == 'x64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Download and verify explicitly requested test model
        if: (inputs.real_model || inputs.candidate)
        run: |
          mkdir -p build-model
          python3 - <<'PY'
          import json, pathlib, urllib.request
          model = json.loads(pathlib.Path('models/manifest.json').read_text())
          urllib.request.urlretrieve(model['url'], 'build-model/laya.gguf')
          PY
          python3 scripts/verify-model.py build-model/laya.gguf
      - name: Install locked TypeScript consumer test tools
        run: npm ci --ignore-scripts --prefix tests/typescript
      - name: Model-free checks
        if: ${{ !(inputs.real_model || inputs.candidate) }}
        run: python3 scripts/validate.py --packages --output build-ci-report --jobs 4 --compiler-launcher "$LAUNCHER"
      - name: Real-model and installed artifact checks
        if: (inputs.real_model || inputs.candidate)
        run: >-
          python3 scripts/validate.py --model build-model/laya.gguf --packages --upstream-reference --output build-ci-report
          --jobs 4 --compiler-launcher "$LAUNCHER"
      - name: Record exact outputs of the built library on this runner CPU
        if: (inputs.real_model || inputs.candidate) && matrix.arch == 'x64'
        run: |
          python3 tests/cross-host.py bundle --build build-validation --output build-ci-report/cross-host/bundle
          python3 tests/cross-host.py record --bundle build-ci-report/cross-host/bundle \
            --model build-model/laya.gguf --report build-ci-report/cross-host/record.json
      - name: Short stress run on the validated library (tier-2 target)
        if: inputs.candidate && matrix.platform == 'linux-arm64'
        run: python3 scripts/check-stress.py build-model/laya.gguf --build build-validation --output build-stress --budget short --jobs 4
      # On the validated build's runner: another image may link other toolchain libraries.
      - name: Two independent builds of one source snapshot (tier-2 target)
        if: inputs.candidate && matrix.platform == 'linux-arm64'
        run: python3 scripts/check-reproducibility.py --output build-repro --jobs 4 --cc gcc --cxx g++
      # Model-free and after every other use of the build: reconfiguring the validated build
      # recompiles nothing, and an edited patched runtime copy is restored and recompiled alone.
      - name: Reconfigure without recompiling
        if: matrix.compiler == 'clang'
        run: python3 tests/reconfigure.py --build build-validation --jobs 4 --edit-copy
      # The gcc builds' packages (the release compiler) are this platform's fragment for
      # scripts/assemble-packages.py, which the assemble job below merges with Windows.
      - name: Retain this platform's packages
        if: matrix.platform
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.platform }}
          path: build-ci-report/packages/
          if-no-files-found: error
          retention-days: ${{ inputs.candidate && 30 || 14 }}
          overwrite: true
      - name: Retain this platform's release evidence
        if: inputs.candidate && matrix.platform
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.platform }}
          path: |
            build-ci-report/
            !build-ci-report/packages/
            !build-ci-report/assembled/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Retain the stress report
        if: inputs.candidate && matrix.platform == 'linux-arm64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stress-${{ matrix.platform }}
          path: build-stress/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Retain the reproducibility report
        if: inputs.candidate && matrix.platform == 'linux-arm64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducibility-${{ matrix.platform }}
          path: |
            build-repro/report.json
            build-repro/*.log
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Retain logs and explicit gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.arch }}-${{ matrix.compiler }}-node-${{ matrix.node }}
          path: build-ci-report/
          if-no-files-found: warn
          retention-days: ${{ inputs.candidate && 30 || 14 }}
          overwrite: true

  windows:
    name: Windows x64 / ${{ (inputs.real_model || inputs.candidate) && 'real model' || 'model free' }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # The test and release scripts read UTF-8 files with Python's default encoding.
      PYTHONUTF8: '1'
      GOTOOLCHAIN: local
      # A candidate run builds without a compiler cache (scripts/check-candidate.py requires it).
      LAUNCHER: ${{ inputs.candidate && 'none' || 'sccache' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      # sccache: clang-cl through Ninja (ccache's MSVC-style support is narrower).
      - name: Compiler cache
        if: ${{ !inputs.candidate }}
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          variant: sccache
          key: ${{ runner.os }}-x64-clang-cl-${{ hashFiles('release/compatibility.json', '.gitmodules') }}
          restore-keys: ${{ runner.os }}-x64-clang-cl
          max-size: 500M
          install: binary
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Exact: javadoc output changes between patch releases, and every platform's
          # javadoc and classes must be the same for scripts/assemble-packages.py.
          java-version: '25.0.4'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install pinned Rust toolchain and fetch locked test dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
          cargo fetch --locked --manifest-path tests/consumers/rust/Cargo.toml
      - name: Install locked TypeScript consumer test tools
        run: npm ci --ignore-scripts --prefix tests/typescript
      - name: Node-API headers and node.lib for this Node, checked against its SHASUMS256.txt
        shell: pwsh
        run: |
          $sdk = python scripts/fetch-node-sdk.py build-node-sdk --lib
          if ($LASTEXITCODE) { exit 1 }
          $sdk | ForEach-Object { $_.Replace('\', '/') } >> $env:GITHUB_ENV
      - name: Download and verify explicitly requested test model
        if: (inputs.real_model || inputs.candidate)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-model | Out-Null
          python -c "import json, pathlib, urllib.request; m = json.loads(pathlib.Path('models/manifest.json').read_text()); urllib.request.urlretrieve(m['url'], 'build-model/laya.gguf')"
          python scripts/verify-model.py build-model/laya.gguf
          if ($LASTEXITCODE) { exit 1 }
          "LAYA_MODEL=$((Resolve-Path build-model/laya.gguf).Path.Replace('\', '/'))" >> $env:GITHUB_ENV
      # scripts/validate.py as on Linux, with clang-cl: native tests, exports, ABI layouts,
      # every binding suite, the packages loaded outside the checkout; with the model also
      # exact agreement between all eight bindings, the original Laya and llama.cpp
      # references and the installed packages. Linux-only tests are listed as skipped.
      - name: Validate with clang-cl
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "CLANG=%VS%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
          set "MODEL="
          if defined LAYA_MODEL set "MODEL=--model %LAYA_MODEL% --upstream-reference"
          rem Strawberry Perl's patch.exe comes first on PATH and crashes; use the one from Git for Windows.
          python scripts/validate.py %MODEL% --packages --output build-ci-report --jobs 4 --compiler-launcher %LAUNCHER% --node-include "%NODE_INCLUDE_DIR%" --node-lib "%NODE_LIB%" --cmake-arg=-GNinja "--cmake-arg=-DCMAKE_C_COMPILER=%CLANG%" "--cmake-arg=-DCMAKE_CXX_COMPILER=%CLANG%" "--cmake-arg=-DDTL_PATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" || exit /b 1
      - name: Short stress run on the validated library (tier-2 target)
        if: inputs.candidate
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          python scripts/check-stress.py build-model/laya.gguf --build build-validation --output build-stress --budget short --jobs 4 || exit /b 1
      # On the validated build's runner: the DLL links the image's MSVC and SDK libraries, so a
      # build on another image version differs.
      - name: Two independent builds of one source snapshot with clang-cl (tier-2 target)
        if: inputs.candidate
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "CLANG=%VS%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
          python scripts/check-reproducibility.py --output "%RUNNER_TEMP%\repro" --jobs 4 --cc "%CLANG%" --cxx "%CLANG%" --node-include "%NODE_INCLUDE_DIR%" --cmake-arg=-GNinja "--cmake-arg=-DNODE_LIB=%NODE_LIB%" "--cmake-arg=-DDTL_PATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" || exit /b 1
      - name: Retain logs and explicit gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-${{ (inputs.real_model || inputs.candidate) && 'real-model' || 'model-free' }}
          path: |
            build-ci-report/
            !build-ci-report/packages/
            !build-ci-report/assembled/
            build-validation/Testing/Temporary/LastTest.log
            build-stress/
          if-no-files-found: warn
          retention-days: ${{ inputs.candidate && 30 || 14 }}
          overwrite: true
      - name: Retain this platform's packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-windows-x64
          path: build-ci-report/packages/
          if-no-files-found: error
          retention-days: ${{ inputs.candidate && 30 || 14 }}
          overwrite: true
      - name: Retain this platform's release evidence
        if: inputs.candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-windows-x64
          path: |
            build-ci-report/
            !build-ci-report/packages/
            !build-ci-report/assembled/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Retain the stress report
        if: inputs.candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stress-windows-x64
          path: build-stress/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Retain the reproducibility report
        if: inputs.candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducibility-windows-x64
          path: |
            ${{ runner.temp }}/repro/report.json
            ${{ runner.temp }}/repro/*.log
            ${{ runner.temp }}/repro/first/install/bin/*.dll
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  # Two independent builds of one source snapshot install identical files, on Windows on every
  # push that changes a library input (scripts/ci-changes.py) and on every dispatch. (A candidate
  # run does this inside each tier-2 target's validation job instead, on the validated build's
  # runner; Linux x86-64 is checked on the release host.) Never through a compiler cache.
  reproducibility:
    name: Windows x64 / independent builds
    needs: changes
    if: ${{ !inputs.candidate && needs.changes.outputs.library == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - name: Node-API headers and node.lib for this Node, checked against its SHASUMS256.txt
        shell: pwsh
        run: |
          $sdk = python scripts/fetch-node-sdk.py build-node-sdk --lib
          if ($LASTEXITCODE) { exit 1 }
          $sdk | ForEach-Object { $_.Replace('\', '/') } >> $env:GITHUB_ENV
      - name: Compile one source snapshot in two directories with clang-cl and compare the installed files
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "CLANG=%VS%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
          python scripts/check-reproducibility.py --output "%RUNNER_TEMP%\repro" --jobs 4 --cc "%CLANG%" --cxx "%CLANG%" --node-include "%NODE_INCLUDE_DIR%" --cmake-arg=-GNinja "--cmake-arg=-DNODE_LIB=%NODE_LIB%" "--cmake-arg=-DDTL_PATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" || exit /b 1
      - name: Retain the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-reproducibility
          path: |
            ${{ runner.temp }}/repro/report.json
            ${{ runner.temp }}/repro/*.log
            ${{ runner.temp }}/repro/first/install/bin/*.dll
            ${{ runner.temp }}/repro/first/install/lib/**/*.node
          if-no-files-found: ignore
          retention-days: 14

  # The release packages: every platform's fragment merged into one npm package, one jar
  # and one NuGet package (scripts/assemble-packages.py), next to each platform's archive
  # and wheel, then installed and loaded on every platform. (platforms.yml builds the
  # macOS fragment; the assembler takes it too.)
  assemble:
    name: Multi-platform packages
    needs: [native, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*-*
          path: fragments
      - name: Assemble
        run: |
          ls fragments
          python3 scripts/assemble-packages.py --output assembled fragments/packages-linux-x64 fragments/packages-linux-arm64 \
            fragments/packages-windows-x64
          jq -e --arg commit "$GITHUB_SHA" '.packaging_source_commit == $commit and .platforms == ["linux-arm64", "linux-x64", "windows-x64"]' \
            assembled/inventory.json
          ls -l assembled
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-assembled
          path: assembled/
          if-no-files-found: error
          retention-days: ${{ inputs.candidate && 30 || 14 }}
          overwrite: true

  # musl (Alpine) is not supported: the packages bundle glibc builds. The loaders must say so
  # instead of failing with a loader error, and npm must refuse the Linux-only npm package.
  musl:
    name: Packages on Alpine (musl) report glibc
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-assembled
          path: assembled
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-linux-x64
          path: linux-x64
      # Docker Hub pulls fail now and then; a pull failure must not fail a candidate run.
      - name: Pull the Alpine images
        run: |
          for image in node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 \
                       eclipse-temurin:25.0.4_7-jdk-alpine-3.24@sha256:541729c21f9308a68cebbe5a0627e4cd465dfe8980fc03bac0b2feaee57daafd; do
            for attempt in 1 2 3 4; do
              docker pull "$image" && break
              [ "$attempt" = 4 ] && exit 1
              sleep $((attempt * 20))
            done
          done
      - name: Node on Alpine
        run: docker run --rm -v "$PWD:/w:ro" node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 sh /w/tests/musl-packages.sh node /w/assembled /w/linux-x64
      - name: Java on Alpine
        run: docker run --rm -v "$PWD:/w:ro" eclipse-temurin:25.0.4_7-jdk-alpine-3.24@sha256:541729c21f9308a68cebbe5a0627e4cd465dfe8980fc03bac0b2feaee57daafd sh /w/tests/musl-packages.sh java /w/assembled

  assembled:
    name: Multi-platform packages on ${{ matrix.platform }} / ${{ (inputs.real_model || inputs.candidate) && 'real model' || 'model free' }}
    needs: assemble
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            python: python3
            shell: bash
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            python: python3
            shell: bash
          # PowerShell on Windows: Strawberry Perl's pkg-config.bat does not run from Git Bash.
          # The commands below are written for both shells.
          - platform: windows-x64
            runner: windows-2025
            python: python
            shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUTF8: '1'
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Exact: javadoc output changes between patch releases, and every platform's
          # javadoc and classes must be the same for scripts/assemble-packages.py.
          java-version: '25.0.4'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: (inputs.real_model || inputs.candidate)
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install pinned Rust toolchain and fetch the consumer's locked dependencies
        if: (inputs.real_model || inputs.candidate)
        run: >-
          rustup toolchain install 1.98.0 --profile minimal && rustup override set 1.98.0 &&
          cargo fetch --locked --manifest-path tests/consumers/rust/Cargo.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-assembled
          path: assembled
      - name: Load every package outside the checkout
        run: ${{ matrix.python }} tests/package-smoke.py assembled --platform ${{ matrix.platform }}
      - name: Download and verify explicitly requested test model
        if: (inputs.real_model || inputs.candidate)
        run: >-
          ${{ matrix.python }} -c "import json, pathlib, urllib.request; pathlib.Path('build-model').mkdir(); m = json.loads(pathlib.Path('models/manifest.json').read_text()); urllib.request.urlretrieve(m['url'], 'build-model/laya.gguf')" &&
          ${{ matrix.python }} scripts/verify-model.py build-model/laya.gguf
      - name: Installed packages with the real model
        if: (inputs.real_model || inputs.candidate)
        run: >-
          ${{ matrix.python }} tests/installed-packages.py assembled build-model/laya.gguf --platform ${{ matrix.platform }}
          --report build-report/installed.json
      # Electron's Chromium sandbox needs unprivileged user namespaces, which Ubuntu 24.04
      # restricts through AppArmor; the arm64 image also lacks some of Chromium's libraries.
      - name: Electron prerequisites on Linux
        if: (inputs.real_model || inputs.candidate) && runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libasound2t64 libgtk-3-0t64 libgbm1 libxss1
      - name: Electron consumer of the multi-platform npm package, directory and ASAR
        if: (inputs.real_model || inputs.candidate)
        run: >-
          npm ci --prefix tests/electron --no-audit --no-fund &&
          node tests/electron/run.cjs assembled/ducktape-laya-$(${{ matrix.python }} -c "import json; print(json.load(open('assembled/inventory.json'))['package_version'])").tgz
          build-model/laya.gguf build-report/electron.json
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-${{ matrix.platform }}-${{ (inputs.real_model || inputs.candidate) && 'real-model' || 'model-free' }}
          path: build-report/
          if-no-files-found: ignore
          retention-days: ${{ inputs.candidate && 30 || 14 }}
          overwrite: true
