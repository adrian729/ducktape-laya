name: Native checks
# Linux x86-64 and arm64 (validate.py), Windows x64, the multi-platform packages
# assembled from their fragments, and Windows build reproducibility.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_model:
        description: Download the pinned test model and run native artifact checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  parser-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build instrumented shared library and model-free contracts
        run: |
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build-sanitized --parallel 2
          ctest --test-dir build-sanitized --output-on-failure
      - name: Mutate request, schema and router inputs
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/input-fuzz.cpp -Iinclude -Lbuild-sanitized -lducktape_laya -o build-sanitized/input-fuzz
          LD_LIBRARY_PATH="$PWD/build-sanitized" build-sanitized/input-fuzz \
            tests/fixtures/primitive.json tests/fixtures/structured.json tests/fixtures/batch.json
      - name: Coverage-guided parser and router smoke
        run: |
          cmake -S . -B build-sanitized -DDUCKTAPE_BUILD_FUZZERS=ON
          cmake --build build-sanitized --target laya-input-fuzzer --parallel 2
          python3 tests/fuzz-corpus.py build-sanitized/corpus
          build-sanitized/laya-input-fuzzer build-sanitized/corpus -seed=444211238 \
            -max_total_time=60 -max_len=1048577 -timeout=30 \
            -artifact_prefix=build-sanitized/fuzzer- -print_final_stats=1 \
            > build-sanitized/fuzzer-smoke.log 2>&1
      - name: Retain sanitizer and fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-sanitizers
          path: |
            build-sanitized/fuzzer-*
            build-sanitized/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
  native:
    name: ${{ matrix.compiler }} / Node ${{ matrix.node }} / ${{ matrix.arch }} / ${{ inputs.real_model && 'real model' || 'model free' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            cc: clang
            cxx: clang++
            node: 24.21.0
            runner: ubuntu-24.04
            arch: x64
          - compiler: gcc
            cc: gcc
            cxx: g++
            node: 26.7.0
            runner: ubuntu-24.04
            arch: x64
          # Linux arm64: native build, ctest, every binding suite and per-platform
          # packages (linux-arm64 tarball, npm, wheel, jar, nupkg) with scripts/package-native.py.
          - compiler: gcc
            cc: gcc
            cxx: g++
            node: 24.21.0
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned Rust toolchain and fetch locked test dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
          cargo fetch --locked --manifest-path tests/consumers/rust/Cargo.toml
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install QEMU user mode for the emulated-CPU guard test
        if: inputs.real_model && matrix.arch == 'x64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Download and verify explicitly requested test model
        if: inputs.real_model
        run: |
          mkdir -p build-model
          python3 - <<'PY'
          import json, pathlib, urllib.request
          model = json.loads(pathlib.Path('models/manifest.json').read_text())
          urllib.request.urlretrieve(model['url'], 'build-model/laya.gguf')
          PY
          python3 scripts/verify-model.py build-model/laya.gguf
      - name: Install locked TypeScript consumer test tools
        run: npm ci --ignore-scripts --prefix tests/typescript
      - name: Model-free checks
        if: ${{ !inputs.real_model }}
        run: python3 scripts/validate.py --packages --output build-ci-report --jobs 2
      - name: Real-model and installed artifact checks
        if: inputs.real_model
        run: python3 scripts/validate.py --model build-model/laya.gguf --packages --upstream-reference --output build-ci-report --jobs 2
      - name: Record exact outputs of the built library on this runner CPU
        if: inputs.real_model && matrix.arch == 'x64'
        run: |
          python3 tests/cross-host.py bundle --build build-validation --output build-ci-report/cross-host/bundle
          python3 tests/cross-host.py record --bundle build-ci-report/cross-host/bundle \
            --model build-model/laya.gguf --report build-ci-report/cross-host/record.json
      # The gcc builds' packages (the release compiler) are this platform's fragment for
      # scripts/assemble-packages.py, which the assemble job below merges with Windows.
      - name: Retain this platform's packages
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-linux-${{ matrix.arch }}
          path: build-ci-report/packages/
          if-no-files-found: error
          retention-days: 14
      - name: Retain logs and explicit gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.arch }}-${{ matrix.compiler }}-node-${{ matrix.node }}
          path: build-ci-report/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows x64 / ${{ inputs.real_model && 'real model' || 'model free' }}
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DUCKTAPE_LAYA_LIB_DIR: ${{ github.workspace }}\build
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # The test and release scripts read UTF-8 files with Python's default encoding.
      PYTHONUTF8: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install pinned Rust toolchain and fetch locked test dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
          cargo fetch --locked --manifest-path tests/consumers/rust/Cargo.toml
      - name: Node-API headers and node.lib for this Node, checked against its SHASUMS256.txt
        shell: pwsh
        run: |
          $sdk = python scripts/fetch-node-sdk.py build-node-sdk --lib
          if ($LASTEXITCODE) { exit 1 }
          $sdk | ForEach-Object { $_.Replace('\', '/') } >> $env:GITHUB_ENV
      - name: Download and verify explicitly requested test model
        if: inputs.real_model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-model | Out-Null
          python -c "import json, pathlib, urllib.request; m = json.loads(pathlib.Path('models/manifest.json').read_text()); urllib.request.urlretrieve(m['url'], 'build-model/laya.gguf')"
          python scripts/verify-model.py build-model/laya.gguf
          if ($LASTEXITCODE) { exit 1 }
          "LAYA_MODEL=$((Resolve-Path build-model/laya.gguf).Path.Replace('\', '/'))" >> $env:GITHUB_ENV
      - name: Build, check exports and run the native tests with clang-cl
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "CLANG=%VS%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
          rem Strawberry Perl's patch.exe comes first on PATH and crashes; use the one from Git for Windows.
          set "EXTRA="
          if defined LAYA_MODEL set "EXTRA=-DDUCKTAPE_TEST_MODEL=%LAYA_MODEL% -DDUCKTAPE_BUILD_REFERENCE_PROBE=ON"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=%CLANG%" "-DCMAKE_CXX_COMPILER=%CLANG%" -DDUCKTAPE_BUILD_NODE=ON "-DNODE_INCLUDE_DIR=%NODE_INCLUDE_DIR%" "-DNODE_LIB=%NODE_LIB%" "-DDTL_PATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" %EXTRA% || exit /b 1
          cmake --build build --parallel 3 || exit /b 1
          dumpbin /nologo /exports build\ducktape_laya.dll > build\exports-dumpbin.txt || exit /b 1
          ctest --test-dir build --output-on-failure || exit /b 1
      - name: Exported symbols
        shell: bash
        run: |
          tr -d '\r' < build/exports-dumpbin.txt | awk '/ordinal +hint +RVA +name/ { table = 1; next } table && /Summary/ { table = 0 } table && NF == 4 { print $4 }' | sort > build/exports.txt
          cat build/exports.txt
          sed 's/^_//' src/exports.macos | sort | diff build/exports.txt -
      - name: Agreement with the original Laya and with llama.cpp
        if: inputs.real_model
        shell: pwsh
        run: |
          python tests/original-reference.py $env:LAYA_MODEL --build-dir build --report build/original-reference.json
          $original = $LASTEXITCODE
          python tests/compare-native-reference.py $env:LAYA_MODEL --build build --report build/upstream-reference.json
          if ($LASTEXITCODE -or $original) { exit 1 }
      - name: Python
        shell: bash
        run: PYTHONPATH=bindings/python/src python -m unittest discover -s bindings/python/tests
      - name: Rust
        shell: pwsh
        run: |
          $env:PATH = "$env:DUCKTAPE_LAYA_LIB_DIR;$env:PATH"
          cargo test --locked --manifest-path bindings/rust/Cargo.toml
      - name: Java
        shell: pwsh
        run: |
          # build.sh with Windows classpath separators.
          $lint = '-Xlint:all,-restricted,-serial,-missing-explicit-ctor,-module'
          New-Item -ItemType Directory -Force bindings/java/target/classes, bindings/java/target/test-classes | Out-Null
          javac --release 22 $lint -d bindings/java/target/classes (Get-ChildItem -Recurse bindings/java/src/main -Filter *.java).FullName
          if ($LASTEXITCODE) { exit 1 }
          javac --release 22 $lint -cp bindings/java/target/classes -d bindings/java/target/test-classes (Get-ChildItem -Recurse bindings/java/src/test -Filter *.java).FullName
          if ($LASTEXITCODE) { exit 1 }
          java --enable-native-access=ALL-UNNAMED -cp "bindings/java/target/classes;bindings/java/target/test-classes" io.github.adrian729.laya.LayaTest
          if ($LASTEXITCODE) { exit 1 }
      - name: .NET
        shell: bash
        run: dotnet test bindings/dotnet/DucktapeLaya.slnx -m:1
      - name: Go
        shell: pwsh
        run: |
          # cgo with the runner's MinGW-w64 gcc; it links ducktape_laya.lib and runs with the DLL on PATH.
          Get-Command gcc | Format-List Source
          gcc --version
          $env:PATH = "$env:DUCKTAPE_LAYA_LIB_DIR;$env:PATH"
          $env:CGO_CFLAGS = "-I$PWD/include"
          $env:CGO_LDFLAGS = "-L$env:DUCKTAPE_LAYA_LIB_DIR"
          go -C bindings/go test -count=1 ./...
          if ($LASTEXITCODE) { exit 1 }
      - name: Node
        shell: pwsh
        run: |
          $env:DUCKTAPE_LAYA_ADDON = "$env:DUCKTAPE_LAYA_LIB_DIR\ducktape_laya.node"
          node --test bindings/node/test.cjs
          if ($LASTEXITCODE) { exit 1 }
      - name: Packages (zip, npm, crates, wheel, jar, NuGet), loaded outside the checkout
        shell: pwsh
        run: |
          python scripts/package-native.py --build build --output build/packages
          if ($LASTEXITCODE) { exit 1 }
          python tests/package-smoke.py build/packages
          if ($LASTEXITCODE) { exit 1 }
          "NPM_PACKAGE=$((Get-Item build/packages/ducktape-laya-*.tgz).FullName)" >> $env:GITHUB_ENV
      - name: Installed packages with the real model
        if: inputs.real_model
        shell: pwsh
        run: |
          python tests/installed-packages.py build/packages $env:LAYA_MODEL
          if ($LASTEXITCODE) { exit 1 }
      - name: Exact agreement between all bindings
        if: inputs.real_model
        shell: pwsh
        run: |
          python tests/parity.py $env:LAYA_MODEL --build-dir build --report build/parity.json
          if ($LASTEXITCODE) { exit 1 }
      - name: Electron consumer, directory and ASAR
        if: inputs.real_model
        shell: pwsh
        run: |
          npm ci --prefix tests/electron --no-audit --no-fund
          if ($LASTEXITCODE) { exit 1 }
          node tests/electron/run.cjs $env:NPM_PACKAGE $env:LAYA_MODEL build/electron.json
          if ($LASTEXITCODE) { exit 1 }
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-${{ inputs.real_model && 'real-model' || 'model-free' }}
          path: |
            build/original-reference.json
            build/upstream-reference.json
            build/parity.json
            build/electron.json
            build/exports.txt
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain this platform's packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-windows-x64
          path: build/packages/
          if-no-files-found: error
          retention-days: 14

  windows-reproducibility:
    name: Windows x64 / independent builds
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - name: Node-API headers and node.lib for this Node, checked against its SHASUMS256.txt
        shell: pwsh
        run: |
          $sdk = python scripts/fetch-node-sdk.py build-node-sdk --lib
          if ($LASTEXITCODE) { exit 1 }
          $sdk | ForEach-Object { $_.Replace('\', '/') } >> $env:GITHUB_ENV
      - name: Compile one source snapshot in two directories with clang-cl and compare the installed files
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "CLANG=%VS%\VC\Tools\Llvm\x64\bin\clang-cl.exe"
          python scripts/check-reproducibility.py --output "%RUNNER_TEMP%\repro" --jobs 3 --cc "%CLANG%" --cxx "%CLANG%" --node-include "%NODE_INCLUDE_DIR%" --cmake-arg=-GNinja "--cmake-arg=-DNODE_LIB=%NODE_LIB%" "--cmake-arg=-DDTL_PATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe" || exit /b 1
      - name: Retain the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-reproducibility
          path: |
            ${{ runner.temp }}/repro/report.json
            ${{ runner.temp }}/repro/*.log
            ${{ runner.temp }}/repro/*/install/bin/ducktape_laya.dll
          if-no-files-found: ignore
          retention-days: 14

  # The release packages: every platform's fragment merged into one npm package, one jar
  # and one NuGet package (scripts/assemble-packages.py), next to each platform's archive
  # and wheel, then installed and loaded on every platform. (platforms.yml builds the
  # macOS fragment; the assembler takes it too.)
  assemble:
    name: Multi-platform packages
    needs: [native, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*-*
          path: fragments
      - name: Assemble
        run: |
          ls fragments
          python3 scripts/assemble-packages.py --output assembled fragments/packages-linux-x64 fragments/packages-linux-arm64 \
            fragments/packages-windows-x64
          jq -e --arg commit "$GITHUB_SHA" '.packaging_source_commit == $commit and .platforms == ["linux-arm64", "linux-x64", "windows-x64"]' \
            assembled/inventory.json
          ls -l assembled
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-assembled
          path: assembled/
          if-no-files-found: error
          retention-days: 14

  assembled:
    name: Multi-platform packages on ${{ matrix.platform }} / ${{ inputs.real_model && 'real model' || 'model free' }}
    needs: assemble
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            python: python3
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            python: python3
          - platform: windows-x64
            runner: windows-2025
            python: python
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUTF8: '1'
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.real_model
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install pinned Rust toolchain and fetch the consumer's locked dependencies
        if: inputs.real_model
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          cargo fetch --locked --manifest-path tests/consumers/rust/Cargo.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-assembled
          path: assembled
      - name: Load every package outside the checkout
        run: ${{ matrix.python }} tests/package-smoke.py assembled --platform ${{ matrix.platform }}
      - name: Download and verify explicitly requested test model
        if: inputs.real_model
        run: |
          mkdir -p build-model
          ${{ matrix.python }} -c "import json, pathlib, urllib.request; m = json.loads(pathlib.Path('models/manifest.json').read_text()); urllib.request.urlretrieve(m['url'], 'build-model/laya.gguf')"
          ${{ matrix.python }} scripts/verify-model.py build-model/laya.gguf
      - name: Installed packages with the real model
        if: inputs.real_model
        run: |
          mkdir -p build-report
          ${{ matrix.python }} tests/installed-packages.py assembled build-model/laya.gguf --platform ${{ matrix.platform }} \
            --report build-report/installed.json
      - name: Electron consumer of the multi-platform npm package, directory and ASAR
        if: inputs.real_model && matrix.platform == 'windows-x64'
        run: |
          npm ci --prefix tests/electron --no-audit --no-fund
          node tests/electron/run.cjs assembled/ducktape-laya-*.tgz build-model/laya.gguf build-report/electron.json
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-${{ matrix.platform }}-${{ inputs.real_model && 'real-model' || 'model-free' }}
          path: build-report/
          if-no-files-found: ignore
          retention-days: 14
