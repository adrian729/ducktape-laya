name: Linux native checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_model:
        description: Download the pinned test model and run native artifact checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  parser-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build instrumented shared library and model-free contracts
        run: |
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            '-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer' \
            '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build-sanitized --parallel 2
          ctest --test-dir build-sanitized --output-on-failure
      - name: Mutate request, schema and router inputs
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/input-fuzz.cpp -Iinclude -Lbuild-sanitized -lducktape_laya -o build-sanitized/input-fuzz
          LD_LIBRARY_PATH="$PWD/build-sanitized" build-sanitized/input-fuzz \
            tests/fixtures/primitive.json tests/fixtures/structured.json tests/fixtures/batch.json
      - name: Coverage-guided parser and router smoke
        run: |
          cmake -S . -B build-sanitized -DDUCKTAPE_BUILD_FUZZERS=ON
          cmake --build build-sanitized --target laya-input-fuzzer --parallel 2
          python3 tests/fuzz-corpus.py build-sanitized/corpus
          build-sanitized/laya-input-fuzzer build-sanitized/corpus -seed=444211238 \
            -max_total_time=60 -max_len=1048577 -timeout=30 \
            -artifact_prefix=build-sanitized/fuzzer- -print_final_stats=1 \
            > build-sanitized/fuzzer-smoke.log 2>&1
      - name: Retain sanitizer and fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-sanitizers
          path: |
            build-sanitized/fuzzer-*
            build-sanitized/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
  native:
    name: ${{ matrix.compiler }} / Node ${{ matrix.node }} / ${{ matrix.arch }} / ${{ inputs.real_model && 'real model' || 'model free' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang
            cc: clang
            cxx: clang++
            node: 24.21.0
            runner: ubuntu-24.04
            arch: x64
          - compiler: gcc
            cc: gcc
            cxx: g++
            node: 26.7.0
            runner: ubuntu-24.04
            arch: x64
          # Linux arm64: native build, ctest, every binding suite and per-platform
          # packages (linux-arm64 tarball, npm, wheel, jar, nupkg).
          - compiler: gcc
            cc: gcc
            cxx: g++
            node: 24.21.0
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned Rust toolchain and fetch locked test dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
          cargo fetch --locked --manifest-path tests/consumers/rust/Cargo.toml
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install QEMU user mode for the emulated-CPU guard test
        if: inputs.real_model && matrix.arch == 'x64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Download and verify explicitly requested test model
        if: inputs.real_model
        run: |
          mkdir -p build-model
          python3 - <<'PY'
          import json, pathlib, urllib.request
          model = json.loads(pathlib.Path('models/manifest.json').read_text())
          urllib.request.urlretrieve(model['url'], 'build-model/laya.gguf')
          PY
          python3 scripts/verify-model.py build-model/laya.gguf
      - name: Install locked TypeScript consumer test tools
        run: npm ci --ignore-scripts --prefix tests/typescript
      - name: Model-free checks
        if: ${{ !inputs.real_model }}
        run: python3 scripts/validate.py --packages --output build-ci-report --jobs 2
      - name: Real-model and installed artifact checks
        if: inputs.real_model
        run: python3 scripts/validate.py --model build-model/laya.gguf --packages --upstream-reference --output build-ci-report --jobs 2
      - name: Record exact outputs of the built library on this runner CPU
        if: inputs.real_model && matrix.arch == 'x64'
        run: |
          python3 tests/cross-host.py bundle --build build-validation --output build-ci-report/cross-host/bundle
          python3 tests/cross-host.py record --bundle build-ci-report/cross-host/bundle \
            --model build-model/laya.gguf --report build-ci-report/cross-host/record.json
      - name: Retain logs and explicit gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.arch }}-${{ matrix.compiler }}-node-${{ matrix.node }}
          path: build-ci-report/
          if-no-files-found: warn
          retention-days: 14
