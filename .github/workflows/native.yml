  # The release packages: every platform's fragment of this run merged into one npm package, one jar
  # and one NuGet package (scripts/assemble-packages.py), next to each platform's archive and wheel.
  # The push and the candidate packages-<P> jobs are both needed: only one of each pair runs.
  assemble:
    name: assemble
    needs: [changes, packages-linux-x64, packages-linux-arm64, packages-windows-x64, packages-macos-arm64, packages-macos-x64,
            packages-candidate-linux-x64, packages-candidate-linux-arm64, packages-candidate-windows-x64,
            packages-candidate-macos-arm64, packages-candidate-macos-x64]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'assemble') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout-shallow
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*-*
          path: fragments
      - name: Assemble
        run: |
          ls fragments
          python3 scripts/assemble-packages.py --output assembled fragments/packages-linux-x64 fragments/packages-linux-arm64 \
            fragments/packages-windows-x64 fragments/packages-macos-arm64 fragments/packages-macos-x64
          jq -e --arg commit "$GITHUB_SHA" '.packaging_source_commit == $commit and .platforms == ["linux-arm64", "linux-x64", "macos-arm64", "macos-x64", "windows-x64"]' \
            assembled/inventory.json
          ls -l assembled
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-assembled
          path: assembled/
          if-no-files-found: error
          retention-days: ${{ needs.changes.outputs.mode == 'candidate' && 30 || 14 }}
          overwrite: true

  # The assembled packages installed and loaded on every platform; in a candidate run also with the
  # real model (tests/installed-packages.py, the only installed_packages carrier) and Electron.
  assembled:
    name: assembled-${{ matrix.platform }}
    needs: [changes, assemble]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.assembled != '[]' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.assembled) }}
    env:
      DTL_JOB: ${{ matrix.job }}
      DTL_NODE: 24.21.0
      DTL_TOOLS: ${{ needs.changes.outputs.mode == 'candidate' && 'rust,java,dotnet,go' || 'java,dotnet' }}
      DTL_MODEL: ${{ needs.changes.outputs.mode == 'candidate' }}
      DTL_KIND: ${{ needs.changes.outputs.mode == 'candidate' && 'real-model' || 'model-free' }}
      PY: ${{ matrix.python }}
    # PowerShell on Windows (the commands below are written for both shells).
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - *defender
      - *checkout-shallow
      - *setup-node
      - *java
      - *nuget-cache
      - *dotnet
      - *go-toolcache
      - *go-toolcache-link
      - *go
      - *rust-cache
      - name: Install pinned Rust toolchain and fetch the consumer's locked dependencies
        if: contains(format(',{0},', env.DTL_TOOLS), ',rust,')
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          cargo fetch --locked --manifest-path tests/consumers/rust/Cargo.toml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-assembled
          path: assembled
      - name: Load every package outside the checkout
        run: ${{ matrix.python }} tests/package-smoke.py assembled --platform ${{ matrix.platform }}
      - &model-key
        name: Pinned test model key
        id: model-key
        if: env.DTL_MODEL == 'true'
        shell: bash
        run: echo "sha256=$("$PY" -c 'import json; print(json.load(open("models/manifest.json"))["sha256"])')" >> "$GITHUB_OUTPUT"
      - &model-restore
        name: Restore the pinned test model
        id: model-cache
        if: env.DTL_MODEL == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-model/laya.gguf
          key: laya-model-${{ steps.model-key.outputs.sha256 }}
          enableCrossOsArchive: true
      - &model-fetch
        name: Download the pinned test model on a cache miss, and verify it
        if: env.DTL_MODEL == 'true'
        shell: bash
        run: |
          mkdir -p build-model
          if [ ! -f build-model/laya.gguf ]; then
            "$PY" -c "import json, urllib.request; m = json.load(open('models/manifest.json')); urllib.request.urlretrieve(m['url'], 'build-model/laya.gguf')"
          fi
          "$PY" scripts/verify-model.py build-model/laya.gguf
      - name: Installed packages with the real model
        if: env.DTL_MODEL == 'true'
        run: >-
          ${{ matrix.python }} tests/installed-packages.py assembled build-model/laya.gguf --platform ${{ matrix.platform }}
          --report build-report/installed.json
      # Electron's Chromium sandbox needs unprivileged user namespaces, which Ubuntu 24.04
      # restricts through AppArmor; the arm64 image also lacks some of Chromium's libraries.
      - name: Electron prerequisites on Linux
        if: env.DTL_MODEL == 'true' && runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=5 install -y --no-install-recommends libnss3 libasound2t64 libgtk-3-0t64 libgbm1 libxss1
      - name: Electron consumer of the multi-platform npm package, directory and ASAR
        if: env.DTL_MODEL == 'true'
        run: >-
          npm ci --prefix tests/electron --no-audit --no-fund &&
          node tests/electron/run.cjs assembled/ducktape-laya-$(${{ matrix.python }} -c "import json; print(json.load(open('assembled/inventory.json'))['package_version'])").tgz
          build-model/laya.gguf build-report/electron.json
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-${{ matrix.platform }}-${{ env.DTL_KIND }}
          path: build-report/
          if-no-files-found: ignore
          retention-days: ${{ needs.changes.outputs.mode == 'candidate' && 30 || 14 }}
          overwrite: true

  # musl (Alpine) is not supported: the packages bundle glibc builds. The loaders must say so
  # instead of failing with a loader error, and npm must refuse the Linux-only npm package.
  musl:
    name: musl
    needs: [changes, assemble]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'musl') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout-shallow
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-assembled
          path: assembled
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-linux-x64
          path: linux-x64
      # Docker Hub pulls fail now and then; a pull failure must not fail a candidate run.
      - name: Pull the Alpine images
        run: |
          for image in node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 \
                       eclipse-temurin:25.0.4_7-jdk-alpine-3.24@sha256:541729c21f9308a68cebbe5a0627e4cd465dfe8980fc03bac0b2feaee57daafd; do
            for attempt in 1 2 3 4; do
              docker pull "$image" && break
              [ "$attempt" = 4 ] && exit 1
              sleep $((attempt * 20))
            done
          done
      - name: Node on Alpine
        run: docker run --rm -v "$PWD:/w:ro" node:24.21.0-alpine3.24@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 sh /w/tests/musl-packages.sh node /w/assembled /w/linux-x64
      - name: Java on Alpine
        run: docker run --rm -v "$PWD:/w:ro" eclipse-temurin:25.0.4_7-jdk-alpine-3.24@sha256:541729c21f9308a68cebbe5a0627e4cd465dfe8980fc03bac0b2feaee57daafd sh /w/tests/musl-packages.sh java /w/assembled

  # Model-free ASan+UBSan through the sanitize preset, pinned clang. The real-model sanitizer
  # runs are qualify-sanitizers-address and -thread.
  sanitizers:
    name: sanitizers
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'sanitizers') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DTL_JOB: sanitizers
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-clang-asan-push
      DTL_CACHE_FALLBACK: |-
        linux-x64-clang-asan-warm
      DTL_CACHE_SAVE: 'true'
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - *checkout
      - *llvm
      - *ninja
      - *compiler-cache
      - name: Instrumented build and the tier-generic tests
        run: |
          launcher=
          [ "$DTL_LAUNCHER" = none ] || launcher=$DTL_LAUNCHER
          cmake --preset sanitize -DGGML_CCACHE=OFF "-DCMAKE_C_COMPILER_LAUNCHER=$launcher" "-DCMAKE_CXX_COMPILER_LAUNCHER=$launcher"
          cmake --build build-sanitize --parallel 4
          ctest --preset sanitize -L '^tier-generic$' --no-tests=error --output-on-failure
      - *cache-stats
      - name: Retain the test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-sanitizers
          path: build-sanitize/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  # The libFuzzer smoke: fuzz preset, laya-input-fuzzer, 60 seconds from the generated corpus.
  fuzzer:
    name: fuzzer
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'fuzzer') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DTL_JOB: fuzzer
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-clang-fuzz-push
      DTL_CACHE_FALLBACK: |-
        linux-x64-clang-fuzz-warm
      DTL_CACHE_SAVE: 'true'
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - *checkout
      - *llvm
      - *ninja
      - *compiler-cache
      - name: Coverage-guided parser and router smoke
        run: |
          launcher=
          [ "$DTL_LAUNCHER" = none ] || launcher=$DTL_LAUNCHER
          cmake --preset fuzz -DGGML_CCACHE=OFF "-DCMAKE_C_COMPILER_LAUNCHER=$launcher" "-DCMAKE_CXX_COMPILER_LAUNCHER=$launcher"
          cmake --build build-fuzz --target laya-input-fuzzer --parallel 4
          python3 tests/fuzz-corpus.py build-fuzz/corpus
          build-fuzz/laya-input-fuzzer build-fuzz/corpus -seed=444211238 \
            -max_total_time=60 -max_len=1048577 -timeout=30 \
            -artifact_prefix=build-fuzz/fuzzer- -print_final_stats=1 \
            > build-fuzz/fuzzer-smoke.log 2>&1
      - *cache-stats
      - name: Retain fuzz output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-fuzzer
          path: build-fuzz/fuzzer-*
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  # Two independent uncached builds of one source snapshot install identical files. One job for the
  # push and the candidate profile (one success verifies the name for both). In a candidate run
  # evidence-windows-x64 requires its build environment to equal the validated build's.
  reproducibility-windows-x64:
    name: reproducibility-windows-x64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'reproducibility-windows-x64') }}
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DTL_JOB: reproducibility-windows-x64
      DTL_NODE: 24.21.0
      PY: python
    steps:
      - *defender
      - *checkout
      - *ninja
      - *setup-node
      - *node-sdk
      - *vs-env
      - name: Compile one source snapshot in two directories with clang-cl and compare the installed files
        run: >-
          python scripts/check-reproducibility.py --output "$RUNNER_TEMP/repro" --jobs 4 --cc "$DTL_CLANG_CL" --cxx "$DTL_CLANG_CL"
          --node-include "$NODE_INCLUDE_DIR" --cmake-arg=-GNinja "--cmake-arg=-DNODE_LIB=$NODE_LIB"
          "--cmake-arg=-DDTL_PATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe"
      - name: Retain the reproducibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducibility-windows-x64
          path: |
            ${{ runner.temp }}/repro/report.json
            ${{ runner.temp }}/repro/*.log
            ${{ runner.temp }}/repro/first/install/bin/*.dll
            ${{ runner.temp }}/repro/first/install/lib/**/*.node
          if-no-files-found: warn
          retention-days: ${{ needs.changes.outputs.mode == 'candidate' && 30 || 14 }}
          overwrite: true

  # ---------------------------------------------------------------- candidate: tooling and tier-2 reproducibility

  # Every policy check; its success is part of the candidate run's success conclusion, which the
  # release checker requires of the evidence run.
  tooling:
    name: tooling
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'tooling') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DTL_JOB: tooling
      DTL_NODE: 26.7.0
      DTL_TOOLS: typescript
    steps:
      - *checkout-plain
      - *runtime-shallow
      - *setup-node
      - *typescript
      - name: Every policy check
        run: python3 scripts/check-policy.py --all --jobs 4 --output build-ci-report
      - *report

  reproducibility-linux-arm64:
    name: reproducibility-linux-arm64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'reproducibility-linux-arm64') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      DTL_JOB: reproducibility-linux-arm64
      DTL_NODE: 24.21.0
    steps:
      - *checkout
      - *ninja
      - *setup-node
      - name: Two independent builds of one source snapshot
        run: python3 scripts/check-reproducibility.py --output build-repro --jobs 4 --cc gcc --cxx g++
      - name: Retain the reproducibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducibility-linux-arm64
          path: |
            build-repro/report.json
            build-repro/*.log
          if-no-files-found: warn
          retention-days: ${{ needs.changes.outputs.mode == 'candidate' && 30 || 14 }}
          overwrite: true

  reproducibility-macos-arm64:
    name: reproducibility-macos-arm64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'reproducibility-macos-arm64') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DTL_JOB: reproducibility-macos-arm64
      DTL_NODE: 24.21.0
    steps:
      - *checkout
      - *ninja
      - *setup-node
      - name: Two independent builds of one source snapshot
        run: python3 scripts/check-reproducibility.py --output build-repro --jobs 3 --cc clang --cxx clang++
      - name: Retain the reproducibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducibility-macos-arm64
          path: |
            build-repro/report.json
            build-repro/*.log
          if-no-files-found: warn
          retention-days: ${{ needs.changes.outputs.mode == 'candidate' && 30 || 14 }}
          overwrite: true

  reproducibility-macos-x64:
    name: reproducibility-macos-x64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'reproducibility-macos-x64') }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DTL_JOB: reproducibility-macos-x64
      DTL_NODE: 24.21.0
    steps:
      - *checkout
      - *ninja
      - *setup-node
      - name: Two independent builds of one source snapshot
        run: python3 scripts/check-reproducibility.py --output build-repro --jobs 4 --cc clang --cxx clang++
      - name: Retain the reproducibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reproducibility-macos-x64
          path: |
            build-repro/report.json
            build-repro/*.log
          if-no-files-found: warn
          retention-days: ${{ needs.changes.outputs.mode == 'candidate' && 30 || 14 }}
          overwrite: true

  # ---------------------------------------------------------------- real-model and candidate: build once per platform

  # validate.py --phase build (with --full in a candidate run): library, addon, tests and the
  # reference probe, through the compiler cache unless cache=off. The build tarball is the whole
  # build directory without objects and the runtime's static archives, plus the build report;
  # every shard of the platform restores it at the same absolute path.
  build-linux-x64:
    name: build-linux-x64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'build-linux-x64') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DTL_JOB: build-linux-x64
      DTL_PLATFORM: linux-x64
      DTL_NODE: 26.7.0
      DTL_MODEL: 'true'
      DTL_MODE: ${{ needs.changes.outputs.mode }}
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-gcc-build
      DTL_CACHE_FALLBACK: |-
        linux-x64-gcc-warm
      DTL_CACHE_SAVE: 'true'
      CC: gcc
      CXX: g++
    steps:
      - *checkout
      - *ninja
      - *compiler-cache
      - *setup-node
      - *model-key
      - *model-restore
      - *model-fetch
      # On a miss (the cache is branch-scoped; warm-linux-x64 seeds it) the build saves the model, so
      # this run's real-model jobs restore it instead of each downloading 431 MB (263-265 s when the
      # download is slow: runs 40245479206 and 40250081027). One key for every OS; a concurrent
      # save of the same key by another build job only warns.
      - &model-save
        name: Save the pinned test model
        if: env.DTL_MODEL == 'true' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build-model/laya.gguf
          key: laya-model-${{ steps.model-key.outputs.sha256 }}
          enableCrossOsArchive: true
      # The probe-only targets (llama.cpp's server and common code, 114 objects) use the job's own cache: `auto` found
      # a ccache on the Windows runner that no step restores or saves, so run 40251619567 compiled them cold
      # (415 s of 489 s compile time, 124 s of wall) while all 104 sccache requests hit.
      - &build-phase
        name: Build phase
        run: |
          full=()
          windows=()
          [ "$DTL_MODE" = candidate ] && full=(--full)
          if [ -n "${DTL_WINDOWS_ARGS:-}" ]; then mapfile -t windows < "$DTL_WINDOWS_ARGS"; fi
          "$PY" scripts/validate.py "${full[@]}" --phase build --model build-model/laya.gguf --upstream-reference \
            --output build-ci-report --jobs 4 --compiler-launcher "$DTL_LAUNCHER" --reference-probe-launcher "$DTL_LAUNCHER" \
            "${windows[@]}"
      - &build-tarball
        name: Build tarball
        run: |
          tar --exclude='*.o' --exclude='*.obj' --exclude='*.d' \
            --exclude='libggml*.a' --exclude='libllama.a' --exclude='libllama-common*.a' --exclude='libmtmd.a' \
            --exclude='ggml*.lib' --exclude='llama.lib' --exclude='llama-common*.lib' --exclude='mtmd.lib' \
            -cf "build-$DTL_PLATFORM.tar" build-validation build-ci-report
          ls -l "build-$DTL_PLATFORM.tar"
      - &build-upload
        name: Retain the build tarball for the shards
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ env.DTL_PLATFORM }}
          path: build-${{ env.DTL_PLATFORM }}.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
          overwrite: true
      - *cache-stats
      - *report

  build-linux-x64-clang:
    name: build-linux-x64-clang
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'build-linux-x64-clang') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DTL_JOB: build-linux-x64-clang
      DTL_PLATFORM: linux-x64-clang
      DTL_NODE: 24.21.0
      DTL_MODEL: 'true'
      DTL_MODE: ${{ needs.changes.outputs.mode }}
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-clang-build
      DTL_CACHE_FALLBACK: |-
        linux-x64-clang-warm
      DTL_CACHE_SAVE: 'true'
    steps:
      - *checkout
      # On a miss (a new branch, or after eviction) the build saves the extracted LLVM, so this run's
      # clang shards restore it instead of each downloading the 1.9 GB archive (about 145 s per job).
      - uses: ./.github/actions/setup-llvm
        with:
          save: 'true'
      - *ninja
      - *compiler-cache
      - *setup-node
      - *model-key
      - *model-restore
      - *model-fetch
      - *model-save
      - *build-phase
      - *build-tarball
      - *build-upload
      - *cache-stats
      - *report

  build-linux-arm64:
    name: build-linux-arm64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'build-linux-arm64') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      DTL_JOB: build-linux-arm64
      DTL_PLATFORM: linux-arm64
      DTL_NODE: 24.21.0
      DTL_MODEL: 'true'
      DTL_MODE: ${{ needs.changes.outputs.mode }}
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-arm64-gcc-build
      DTL_CACHE_FALLBACK: |-
        linux-arm64-gcc-warm
      DTL_CACHE_SAVE: 'true'
      CC: gcc
      CXX: g++
    steps:
      - *checkout
      - *ninja
      - *compiler-cache
      - *setup-node
      - *model-key
      - *model-restore
      - *model-fetch
      - *model-save
      - *build-phase
      - *build-tarball
      - *build-upload
      - *cache-stats
      - *report

  build-windows-x64:
    name: build-windows-x64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'build-windows-x64') }}
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      DTL_JOB: build-windows-x64
      DTL_PLATFORM: windows-x64
      DTL_NODE: 24.21.0
      DTL_MODEL: 'true'
      DTL_MODE: ${{ needs.changes.outputs.mode }}
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'sccache' }}
      DTL_CACHE_KEY: windows-x64-clang-cl-build
      DTL_CACHE_FALLBACK: |-
        windows-x64-clang-cl-warm
      DTL_CACHE_SAVE: 'true'
      PY: python
    steps:
      - *defender
