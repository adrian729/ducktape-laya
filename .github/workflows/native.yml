        linux-arm64-gcc-build
      DTL_CACHE_SAVE: 'true'
      CC: gcc
      CXX: g++
    steps:
      - *checkout
      - *ninja
      - *compiler-cache
      - *setup-node
      - *model-key
      - *model-restore
      - *model-fetch
      - *model-save
      - *build-phase
      - *cache-stats

  warm-windows-x64:
    name: warm-windows-x64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'warm-windows-x64') }}
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      DTL_JOB: warm-windows-x64
      DTL_NODE: 24.21.0
      DTL_MODEL: 'true'
      DTL_MODE: ${{ needs.changes.outputs.mode }}
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'sccache' }}
      DTL_CACHE_KEY: windows-x64-clang-cl-warm
      DTL_CACHE_FALLBACK: |-
        windows-x64-clang-cl-build
      DTL_CACHE_SAVE: 'true'
      PY: python
    steps:
      - *defender
      - *checkout
      - *ninja
      - *compiler-cache
      - *setup-node
      - *node-sdk
      - *vs-env
      - *windows-args
      - *model-key
      - *model-restore
      - *model-fetch
      - *model-save
      - *build-phase
      - *cache-stats

  warm-macos-arm64:
    name: warm-macos-arm64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'warm-macos-arm64') }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DTL_JOB: warm-macos-arm64
      DTL_NODE: 24.21.0
      DTL_MODEL: 'true'
      DTL_MODE: ${{ needs.changes.outputs.mode }}
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: macos-arm64-appleclang-warm
      DTL_CACHE_FALLBACK: |-
        macos-arm64-appleclang-build
      DTL_CACHE_SAVE: 'true'
    steps:
      - *checkout
      - *ninja
      - *compiler-cache
      - *setup-node
      - *model-key
      - *model-restore
      - *model-fetch
      - *model-save
      - *build-phase
      - *cache-stats

  warm-macos-x64:
    name: warm-macos-x64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'warm-macos-x64') }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      DTL_JOB: warm-macos-x64
      DTL_NODE: 24.21.0
      DTL_MODEL: 'true'
      DTL_MODE: ${{ needs.changes.outputs.mode }}
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: macos-x64-appleclang-warm
      DTL_CACHE_FALLBACK: |-
        macos-x64-appleclang-build
      DTL_CACHE_SAVE: 'true'
    steps:
      - *checkout
      - *ninja
      - *compiler-cache
      - *setup-node
      - *model-key
      - *model-restore
      - *model-fetch
      - *model-save
      - *build-phase
      - *cache-stats

  warm-asan:
    name: warm-asan
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'warm-asan') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DTL_JOB: warm-asan
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-clang-asan-warm
      DTL_CACHE_FALLBACK: |-
        linux-x64-clang-asan-push
      DTL_CACHE_SAVE: 'true'
      DTL_PRESET: sanitize
      DTL_TARGET: all
    steps:
      - *checkout
      - *llvm
      - *ninja
      - *compiler-cache
      - &preset-build
        name: Build through the preset
        run: |
          launcher=
          [ "$DTL_LAUNCHER" = none ] || launcher=$DTL_LAUNCHER
          cmake --preset "$DTL_PRESET" -DGGML_CCACHE=OFF "-DCMAKE_C_COMPILER_LAUNCHER=$launcher" "-DCMAKE_CXX_COMPILER_LAUNCHER=$launcher"
          cmake --build "build-$DTL_PRESET" --target "$DTL_TARGET" --parallel 4
      - *cache-stats

  warm-tsan:
    name: warm-tsan
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'warm-tsan') }}
