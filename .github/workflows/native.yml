  binding-linux-x64:
    name: binding-${{ matrix.lang }}-linux-x64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.bindings_linux_x64 != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.bindings_linux_x64) }}
    env:
      DTL_JOB: ${{ matrix.job }}
      # Only the node suite loads the addon: another language's job builds none and sets up no Node
      # (scripts/validate.py's addon_needed, tests/ci-contracts.py).
      DTL_NODE: ${{ matrix.lang == 'node' && '26.7.0' || '' }}
      DTL_TOOLS: ${{ matrix.lang }}
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-gcc-generic
      DTL_CACHE_FALLBACK: |-
        linux-x64-gcc-build
        linux-x64-gcc-warm
      DTL_CACHE_SAVE: 'false'
      CC: gcc
      CXX: g++
    steps:
      - *checkout
      - *ninja
      - *compiler-cache
      - *setup-node
      - &rust-cache
        name: Rust toolchain and crate cache
        if: contains(format(',{0},', env.DTL_TOOLS), ',rust,')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/1.98.0-*
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: rust-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bindings/rust/Cargo.lock', 'tests/consumers/rust/Cargo.lock') }}
      - &rust
        name: Install pinned Rust toolchain and fetch locked test dependencies
        if: contains(format(',{0},', env.DTL_TOOLS), ',rust,')
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0
          cargo fetch --locked --manifest-path bindings/rust/Cargo.toml
          cargo fetch --locked --manifest-path tests/consumers/rust/Cargo.toml
      - &java
        if: contains(format(',{0},', env.DTL_TOOLS), ',java,')
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Exact: javadoc output changes between patch releases, and every platform's
          # javadoc and classes must be the same for scripts/assemble-packages.py.
          java-version: '25.0.4'
      - &nuget-cache
        name: NuGet package cache
        if: contains(format(',{0},', env.DTL_TOOLS), ',dotnet,')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bindings/dotnet/**/*.csproj', 'tests/consumers/dotnet/*.csproj') }}
      - &dotnet
        if: contains(format(',{0},', env.DTL_TOOLS), ',dotnet,')
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
      # Go 1.27.2 is not in the runner images' tool cache: keep the downloaded one.
      - &go-toolcache
        name: Go tool cache
        if: contains(format(',{0},', env.DTL_TOOLS), ',go,')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # On Windows setup-go keeps Go under D:\hostedtoolcache and links it (x64, x64.complete)
          # from the tool cache on C:. Git's tar cannot restore that junction, so only the D: files
          # are cached and the next step links them.
          path: ${{ runner.os == 'Windows' && 'D:/hostedtoolcache/windows/go/1.27.2' || format('{0}/go/1.27.2', runner.tool_cache) }}
          key: go-toolcache-v3-1.27.2-${{ runner.os }}-${{ runner.arch }}
      - &go-toolcache-link
        name: Link the cached Go into the Windows tool cache
        if: runner.os == 'Windows' && contains(format(',{0},', env.DTL_TOOLS), ',go,')
        shell: pwsh
        run: |
          $d = 'D:\hostedtoolcache\windows\go\1.27.2\x64'
          $c = Join-Path $env:RUNNER_TOOL_CACHE 'go\1.27.2\x64'
          if ((Test-Path "$d\bin\go.exe") -and (Test-Path "$d.complete") -and -not (Test-Path $c)) {
            New-Item -ItemType Directory -Force (Split-Path $c) | Out-Null
            New-Item -ItemType Junction -Path $c -Target $d | Out-Null
            Copy-Item "$d.complete" "$c.complete"
            Write-Output "linked $c -> $d"
          }
      - &go
        if: contains(format(',{0},', env.DTL_TOOLS), ',go,')
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      # Go's build cache does not see the library's contents (golang/go#29843): the header is in the
      # key, the tests always rerun (-count=1) and the library is linked dynamically.
      - &go-cache
        name: Go build cache
        if: contains(format(',{0},', env.DTL_TOOLS), ',go,')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\go-build' || runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
          key: gocache-1.27.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bindings/go/go.mod', 'tests/consumers/go/go.mod', 'include/ducktape_laya.h') }}
      - name: Model-free binding suite
        run: python3 scripts/validate.py --library-only --bindings "${{ matrix.lang }}" --output build-ci-report --jobs 4 --compiler-launcher "$DTL_LAUNCHER"
      - *cache-stats
      - *report

