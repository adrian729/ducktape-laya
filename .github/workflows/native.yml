    timeout-minutes: 60
    env:
      DTL_JOB: warm-tsan
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-clang-tsan-warm
      DTL_CACHE_SAVE: 'true'
      DTL_PRESET: sanitize-thread
      DTL_TARGET: all
    steps:
      - *checkout
      - *llvm
      - *ninja
      - *compiler-cache
      - *preset-build
      - *cache-stats

  warm-fuzz:
    name: warm-fuzz
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'warm-fuzz') }}
