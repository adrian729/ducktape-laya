  # ---------------------------------------------------------------- shards (from the build tarball)

  # One matrix job per platform; the jobs, their checks and side outputs come from
  # scripts/ci_paths.py SHARDS (real_model or candidate mode). validate.py --phase test never
  # builds: it requires the library, addon and CMake cache of the build report.
  shards-linux-x64:
    name: ${{ matrix.job }}
    needs: [changes, build-linux-x64]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.shards_linux_x64 != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.shards_linux_x64) }}
    env:
      DTL_JOB: ${{ matrix.job }}
      DTL_PLATFORM: linux-x64
      DTL_NODE: 26.7.0
      DTL_TOOLS: ${{ matrix.tools }}
      DTL_MODEL: 'true'
      CC: gcc
      CXX: g++
    steps:
      - *checkout
      - *setup-node
      - *rust-cache
      - *rust
      - *java
      - *nuget-cache
      - *dotnet
      - *go-toolcache
      - *go-toolcache-link
      - *go
      - *go-cache
      - *typescript
      # Every apt-get here gives up on a stalled mirror transfer after 20 s and retries: one stalled
      # qemu-user download took 5 minutes (run 40514690172) against 13 s normally.
      - &qemu
        name: QEMU user mode for the emulated-CPU guard test
        if: matrix.qemu
        run: sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=5 update && sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=5 install -y --no-install-recommends qemu-user
      - *model-key
      - *model-restore
      - *model-fetch
      - &build-download
        name: Restore the build tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-${{ env.DTL_PLATFORM }}
      - &build-extract
        name: Extract the build at its absolute path
        run: |
          tar -xf "build-$DTL_PLATFORM.tar"
          rm "build-$DTL_PLATFORM.tar"
      - &shard-run
        name: Shard checks
        env:
          CHECKS: ${{ matrix.checks }}
        run: |
          windows=()
          if [ -n "${DTL_WINDOWS_ARGS:-}" ]; then mapfile -t windows < "$DTL_WINDOWS_ARGS"; fi
          "$PY" scripts/validate.py --phase test --from build-validation --checks "$CHECKS" --output build-shard \
            --test-jobs 4 "${windows[@]}"
      # The CI side of the tier-1 cross_cpu comparison (a SHARDS side output of native-linux-x64).
      - &cross-host
        name: Record exact outputs of the built library on this runner CPU
        if: matrix.cross_host
        run: |
          python3 tests/cross-host.py bundle --build build-validation --output build-shard/cross-host/bundle
          python3 tests/cross-host.py record --bundle build-shard/cross-host/bundle \
            --model build-model/laya.gguf --report build-shard/cross-host/record.json
      - &shard-upload
        name: Retain the shard for the merge
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shard.${{ env.DTL_PLATFORM }}.${{ matrix.label }}
          path: |
            build-shard/
            !build-shard/packages/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

