    env:
      DTL_JOB: warm-fuzz
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-clang-fuzz-warm
      DTL_CACHE_FALLBACK: |-
        linux-x64-clang-fuzz-push
      DTL_CACHE_SAVE: 'true'
      DTL_PRESET: fuzz
      DTL_TARGET: laya-input-fuzzer
    steps:
      - *checkout
      - *llvm
      - *ninja
      - *compiler-cache
      - *preset-build
      - *cache-stats

  # Keep the newest two entries per key prefix and ref; drop entries of deleted or merged branches.
  # A warm-cache dispatch on another ref only lists what it would delete.
  cache-prune:
    name: cache-prune
    needs: [changes, warm-linux-x64, warm-linux-x64-clang, warm-linux-arm64, warm-windows-x64, warm-macos-arm64, warm-macos-x64, warm-asan, warm-tsan, warm-fuzz]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'cache-prune') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - *checkout-plain
      - name: Prune the caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dry=()
          [ "$GITHUB_REF" = refs/heads/main ] || dry=(--dry-run)
          python3 scripts/ci-cache-prune.py --repository "$GITHUB_REPOSITORY" "${dry[@]}"

  # ---------------------------------------------------------------- experiment (V1)

  # Windows inference speed: tests/benchmark.py with the product flags and with /clang:-O2, and the
  # page faults of opening the model. clang-cl turns the product's /O2 into cc1 -O3 (so /clang:-O3
  # compiled the very same bytes: V1 C7, DLL 12c4b6897a3a for both); /clang:-O2 is the variant that
  # differs. Each variant records the cc1 flags of a ggml source and the job fails if both libraries
  # are identical. Data for a follow-up; a flag change is adopted only if faster with byte-identical
  # outputs.
  bench-windows-x64:
    name: bench-windows-x64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'bench-windows-x64') }}
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      DTL_JOB: bench-windows-x64
      DTL_MODEL: 'true'
      PY: python
    steps:
      - *defender
      - *checkout
      - *ninja
      - *vs-env
      - *model-key
      - *model-restore
      - *model-fetch
      - name: Library builds with the product flags and with /clang:-O2
        run: |
          mkdir -p build-bench
          for variant in product o2; do
            flags=()
            [ "$variant" = o2 ] && flags=('-DCMAKE_C_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /clang:-O2' '-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /clang:-O2')
            cmake -S . -B "build-bench/$variant" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              "-DCMAKE_C_COMPILER=$DTL_CLANG_CL" "-DCMAKE_CXX_COMPILER=$DTL_CLANG_CL" \
              '-DDTL_PATCH_EXECUTABLE=C:/Program Files/Git/usr/bin/patch.exe' \
              -DDUCKTAPE_BUILD_NODE=OFF -DDUCKTAPE_BUILD_TESTS=OFF -DDUCKTAPE_BUILD_EXAMPLES=OFF "${flags[@]}"
            cmake --build "build-bench/$variant" --parallel 4
          done
      - name: The variants differ (cc1 flags and library bytes)
        run: |
          "$PY" - build-bench <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          out, digests = pathlib.Path(sys.argv[1]), {}
          for variant in ('product', 'o2'):
              build = out / variant
              entry = next(e for e in json.loads((build / 'compile_commands.json').read_text())
                           if e['file'].replace('\\', '/').endswith('ggml-cpu/ggml-cpu.c'))
              # The driver's -### prints the cc1 command it would run; the optimization level is what cc1 gets.
              # CMake ends a clang-cl command with `-- SOURCE`, after which every argument is an input.
              command = entry['command']
              command = command.replace(' -- ', ' -### -- ', 1) if ' -- ' in command else command + ' -###'
              driver = subprocess.run(command, cwd=entry['directory'], capture_output=True, text=True)
              cc1 = [line for line in driver.stderr.splitlines() if '"-cc1"' in line]
              if driver.returncode or not cc1:
                  sys.exit(f'{variant}: no cc1 command from the driver:\n{driver.stderr}')
              levels = sorted({arg.strip('"') for arg in cc1[-1].split() if arg.strip('"')[:2] == '-O'})
              digests[variant] = hashlib.sha256((build / 'ducktape_laya.dll').read_bytes()).hexdigest()
              record = {'source': entry['file'], 'cc1_optimization': levels, 'dll_sha256': digests[variant]}
              (out / f'flags-{variant}.json').write_text(json.dumps(record, indent=2) + '\n')
              print(variant, record)
          if digests['product'] == digests['o2']:
              sys.exit('The o2 variant compiled the same library as the product: its flags did not reach the compiler')
          PY
      - name: Page faults and time of opening the model
        run: |
          for variant in product o2; do
            "$PY" - "build-bench/$variant" build-model/laya.gguf "build-bench/open-$variant.json" <<'PY'
          import ctypes as c, ctypes.wintypes as w, json, os, pathlib, sys, time
          class Counters(c.Structure):
              _fields_ = [('cb', w.DWORD), ('PageFaultCount', w.DWORD)] + [(name, c.c_size_t) for name in (
                  'PeakWorkingSetSize', 'WorkingSetSize', 'QuotaPeakPagedPoolUsage', 'QuotaPagedPoolUsage',
                  'QuotaPeakNonPagedPoolUsage', 'QuotaNonPagedPoolUsage', 'PagefileUsage', 'PeakPagefileUsage')]
          psapi, kernel32 = c.WinDLL('psapi'), c.WinDLL('kernel32')
          kernel32.GetCurrentProcess.restype = w.HANDLE
          psapi.GetProcessMemoryInfo.argtypes = [w.HANDLE, c.POINTER(Counters), w.DWORD]
          def counters():
              value = Counters(cb=c.sizeof(Counters))
              psapi.GetProcessMemoryInfo(kernel32.GetCurrentProcess(), c.byref(value), value.cb)
              return value
          build, model, report = map(pathlib.Path, sys.argv[1:4])
          os.add_dll_directory(str(build.resolve()))
          library = c.CDLL(str((build / 'ducktape_laya.dll').resolve()))
          library.dtl_open.argtypes = [c.c_char_p, c.c_char_p, c.POINTER(c.c_void_p), c.POINTER(c.c_void_p)]
          library.dtl_open.restype = c.c_int32
          library.dtl_close.argtypes = [c.c_void_p]
          before, started = counters(), time.perf_counter()
          engine, error = c.c_void_p(), c.c_void_p()
          status = library.dtl_open(str(model.resolve()).encode(), b'{"threads": 4}', c.byref(engine), c.byref(error))
          elapsed, after = time.perf_counter() - started, counters()
          if status == 0: library.dtl_close(engine)
          result = {'status': status, 'open_seconds': elapsed, 'page_faults': after.PageFaultCount - before.PageFaultCount,
                    'peak_working_set_bytes': after.PeakWorkingSetSize}
          report.write_text(json.dumps(result, indent=2) + '\n')
          print(build.name, result)
          PY
          done
      # An experiment: a failing benchmark does not fail the job; the logs and any reports are kept.
      - name: Benchmark with the product flags and with /clang:-O2
        continue-on-error: true
        run: |
          for variant in product o2; do
            "$PY" tests/benchmark.py build-model/laya.gguf --build "build-bench/$variant" --report "build-bench/benchmark-$variant.json" \
              2>&1 | tee "build-bench/benchmark-$variant.log"
          done
      - name: Retain the measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-windows-x64
          path: |
            build-bench/*.json
            build-bench/*.log
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
