  # ---------------------------------------------------------------- candidate: merged evidence per platform

  # scripts/merge-validation.py merges the platform's shards into one report (profile from SHARDS:
  # ci-full, or ci-compiler for linux-x64-clang). On a tier-2 platform the stress and
  # reproducibility runs must have run on the build's image (build_environment), or the merge stops.
  evidence-linux-x64:
    name: evidence-linux-x64
    needs: [changes, build-linux-x64, shards-linux-x64, packages-candidate-linux-x64]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'evidence-linux-x64') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DTL_JOB: evidence-linux-x64
      DTL_PLATFORM: linux-x64
      DTL_EVIDENCE: evidence-linux-x64
      DTL_NATIVE: native-x64-gcc-node-26.7.0
      DTL_TIER2: 'false'
    steps:
      - *checkout
      - *build-download
      - *build-extract
      - &shards-download
        name: Restore the shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shard.${{ env.DTL_PLATFORM }}.*
          path: shards
      - &tier2-stress
        name: Restore the stress report
        if: env.DTL_TIER2 == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stress-${{ env.DTL_PLATFORM }}
          path: tier2/stress
      - &tier2-reproducibility
        name: Restore the reproducibility report
        if: env.DTL_TIER2 == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reproducibility-${{ env.DTL_PLATFORM }}
          path: tier2/reproducibility
      - &image-check
        name: Stress and reproducibility on the build's image
        if: env.DTL_TIER2 == 'true'
        run: |
          "$PY" - <<'PY'
          import json
          build = json.load(open('build-ci-report/report.json')).get('build_environment')
          for name in ('stress', 'reproducibility'):
              other = json.load(open(f'tier2/{name}/report.json')).get('build_environment')
              if other != build:
                  raise SystemExit(f'image changed: rerun (the {name} job ran on {other}, the build on {build})')
          print(f'build environment {build}')
          PY
      - &merge
        name: Merge the shards
        run: |
          profile=$("$PY" -c "import sys; sys.path.insert(0, 'scripts'); import ci_paths; print(ci_paths.SHARDS['candidate']['$DTL_PLATFORM']['profile'])")
          ls shards
          "$PY" scripts/merge-validation.py --profile "$profile" --output build-evidence --build build-validation shards/*
      - &evidence-upload
        name: Retain this platform's release evidence
        if: env.DTL_EVIDENCE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.DTL_EVIDENCE }}
          path: |
            build-evidence/
            !build-evidence/packages/
            !build-evidence/assembled/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      # The native matrix report (and on gcc the cross-host record and bundle) under the name
      # scripts/fetch-ci-evidence.py takes as optional native-x64-* evidence.
      - &native-upload
        name: Retain the native matrix report
        if: env.DTL_NATIVE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.DTL_NATIVE }}
          path: |
            build-evidence/
            !build-evidence/packages/
            !build-evidence/assembled/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

