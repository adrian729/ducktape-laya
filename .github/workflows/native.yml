  # ---------------------------------------------------------------- qualify: the CI long gates

  # mode=qualify (dispatched after the candidate's build jobs have finished): the real-model
  # sanitizer runs, the fuzz campaign and the runtime upgrade rehearsal, through the compiler
  # cache (instrumented or rehearsal builds, never shipped). scripts/fetch-ci-evidence.py --qualify
  # downloads sanitizers, fuzz and upgrade.
  qualify-sanitizers-address:
    name: qualify-sanitizers-address
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'qualify-sanitizers-address') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DTL_JOB: qualify-sanitizers-address
      DTL_MODEL: 'true'
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-clang-asan-warm
      DTL_CACHE_FALLBACK: |-
        linux-x64-clang-asan-push
      DTL_CACHE_SAVE: 'false'
    steps:
      - *checkout
      - *llvm
      - *ninja
      - *compiler-cache
      - *model-key
      - *model-restore
      - *model-fetch
      - name: ASan and UBSan with the real model (sanitize preset)
        run: >-
          python3 scripts/check-sanitizers.py build-model/laya.gguf --only address --compiler-launcher "$DTL_LAUNCHER"
          --jobs 4 --test-jobs 4 --output build-qualify/address
      - *cache-stats
      - &qualify-upload
        name: Retain the report for the merge
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.DTL_JOB }}
          path: build-qualify/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true

  qualify-sanitizers-thread:
    name: qualify-sanitizers-thread
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'qualify-sanitizers-thread') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DTL_JOB: qualify-sanitizers-thread
      DTL_MODEL: 'true'
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-clang-tsan-warm
      DTL_CACHE_SAVE: 'false'
    steps:
      - *checkout
      - *llvm
      - *ninja
      - *compiler-cache
      - *model-key
      - *model-restore
      - *model-fetch
      # TSan's shadow mapping does not fit the runner kernel's default ASLR entropy.
      - name: Address-space randomization for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      # The Rust leg: cargo +nightly-2026-10-17 test -Zbuild-std (rustc 1.101.0-nightly 5d8fec066).
      - name: Pinned Rust nightly with rust-src
        run: rustup toolchain install nightly-2026-10-17 --profile minimal --component rust-src
      - name: TSan with the real model (sanitize-thread preset), native and Rust
        run: >-
          python3 scripts/check-sanitizers.py build-model/laya.gguf --only thread --compiler-launcher "$DTL_LAUNCHER"
          --jobs 4 --test-jobs 4 --output build-qualify/thread
      - *cache-stats
      - *qualify-upload

  qualify-sanitizers:
    name: qualify-sanitizers
    needs: [changes, qualify-sanitizers-address, qualify-sanitizers-thread]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'qualify-sanitizers') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualify-sanitizers-address
          path: qualify/address-run
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualify-sanitizers-thread
          path: qualify/thread-run
      # Refuses unless both passed on the same clean commit, model and runtime.
      - name: Merge the address and thread reports
        run: >-
          python3 scripts/check-sanitizers.py --merge qualify/address-run/address qualify/thread-run/thread
          --output build-qualify/sanitizers
      - name: Retain the sanitizer evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanitizers
          path: build-qualify/sanitizers/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  qualify-fuzz:
    name: qualify-fuzz
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'qualify-fuzz') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DTL_JOB: qualify-fuzz
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-clang-fuzz-warm
      DTL_CACHE_FALLBACK: |-
        linux-x64-clang-fuzz-push
      DTL_CACHE_SAVE: 'false'
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds }}
    steps:
      - *checkout
      - *llvm
      - *ninja
      - *compiler-cache
      - name: Fuzz campaign (fuzz preset)
        run: |
          cmake --preset fuzz
          python3 scripts/check-fuzz.py --seconds "$FUZZ_SECONDS" --compiler-launcher "$DTL_LAUNCHER" --jobs 4 --output build-qualify/fuzz
      - *cache-stats
      - name: Retain the fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz
          path: build-qualify/fuzz/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  # check-upgrade.py runs ctest, the Cargo and Node tests and tests/parity.py for each pair: gcc
  # (the product compiler) and every binding toolchain. The rehearsed runtime commit is fetched
  # into the submodule's object database.
  qualify-upgrade:
    name: qualify-upgrade
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'qualify-upgrade') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DTL_JOB: qualify-upgrade
      DTL_NODE: 26.7.0
      DTL_TOOLS: rust,java,dotnet,go
      DTL_MODEL: 'true'
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-gcc-build
      DTL_CACHE_FALLBACK: |-
        linux-x64-gcc-warm
      DTL_CACHE_SAVE: 'false'
      RUNTIME: ${{ needs.changes.outputs.runtime }}
      CC: gcc
      CXX: g++
    steps:
      - *checkout
      - *ninja
      - *compiler-cache
      - *setup-node
      - *rust-cache
      - *rust
      - *java
      - *nuget-cache
      - *dotnet
      - *go-toolcache
      - *go-toolcache-link
      - *go
      - *go-cache
      - *model-key
      - *model-restore
      - *model-fetch
      # check-upgrade.py runs every registered real-model test, the emulated-CPU guard included.
      - name: QEMU user mode for the emulated-CPU guard test
        run: sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=5 update && sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::Retries=5 install -y --no-install-recommends qemu-user
      - name: Runtime commit to rehearse
        run: |
          git -C third_party/llama.cpp cat-file -e "$RUNTIME^{commit}" 2>/dev/null \
            || git -C third_party/llama.cpp fetch --no-tags --depth=1 origin "$RUNTIME"
          git -C third_party/llama.cpp log -1 --format='%H %cs %s' "$RUNTIME"
      - name: Runtime upgrade rehearsal
        run: >-
          python3 scripts/check-upgrade.py --runtime "$RUNTIME" --model build-model/laya.gguf
          --compiler-launcher "$DTL_LAUNCHER" --jobs 4 --output build-qualify/upgrade
      - *cache-stats
      - name: Retain the upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upgrade
          path: build-qualify/upgrade/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  # ---------------------------------------------------------------- warm-cache: nightly seeds, then prune

  # Build-only jobs for every evidence configuration, every night (also when main is unchanged, so
  # main's entries never age out). Saved from main, every branch restores them. Only these jobs
  # save the model and the LLVM toolchain.
  warm-linux-x64:
    name: warm-linux-x64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'warm-linux-x64') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DTL_JOB: warm-linux-x64
      DTL_NODE: 26.7.0
      DTL_MODEL: 'true'
      DTL_MODE: ${{ needs.changes.outputs.mode }}
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-gcc-warm
      DTL_CACHE_FALLBACK: |-
        linux-x64-gcc-build
      DTL_CACHE_SAVE: 'true'
      CC: gcc
      CXX: g++
    steps:
      - *checkout
      - *ninja
      - *compiler-cache
      - *setup-node
      - *model-key
      - *model-restore
      - *model-fetch
      - *model-save
      - *build-phase
      - *cache-stats

  warm-linux-x64-clang:
    name: warm-linux-x64-clang
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'warm-linux-x64-clang') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DTL_JOB: warm-linux-x64-clang
      DTL_NODE: 24.21.0
      DTL_MODEL: 'true'
      DTL_MODE: ${{ needs.changes.outputs.mode }}
      DTL_LAUNCHER: ${{ needs.changes.outputs.cache == 'off' && 'none' || 'ccache' }}
      DTL_CACHE_KEY: linux-x64-clang-warm
      DTL_CACHE_FALLBACK: |-
        linux-x64-clang-build
      DTL_CACHE_SAVE: 'true'
    steps:
      - *checkout
      # Saves the extracted LLVM toolchain on a miss, as build-linux-x64-clang does.
      - uses: ./.github/actions/setup-llvm
        with:
          save: 'true'
      - *ninja
      - *compiler-cache
      - *setup-node
      - *model-key
      - *model-restore
      - *model-fetch
      - *model-save
      - *build-phase
      - *cache-stats

  warm-linux-arm64:
    name: warm-linux-arm64
    needs: changes
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(fromJSON(needs.changes.outputs.run), 'warm-linux-arm64') }}
    runs-on: ubuntu-24.04-arm
