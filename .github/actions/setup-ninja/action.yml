name: Set up Ninja
description: >-
  Puts Ninja on PATH: the runner's own when it has one, otherwise the pinned
  Ninja 1.13.2 release zip, checked against its sha256 before it is unpacked.
  Linux x64 and arm64, macOS and Windows x64.
runs:
  using: composite
  steps:
    - name: Ninja on PATH or the pinned release
      shell: bash
      run: |
        set -euo pipefail
        if command -v ninja >/dev/null 2>&1; then
          echo "ninja $(ninja --version) from $(command -v ninja)"
          exit 0
        fi
        # The digests are the release assets' sha256 as GitHub records them (ninja-build/ninja v1.13.2).
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)   asset=ninja-linux.zip;         sum=5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6 ;;
          Linux-ARM64) asset=ninja-linux-aarch64.zip; sum=fd2cacc8050a7f12a16a2e48f9e06fca5c14fc4c2bee2babb67b58be17a607fc ;;
          macOS-*)     asset=ninja-mac.zip;           sum=c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b ;;
          Windows-X64) asset=ninja-win.zip;           sum=07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65 ;;
          *) echo "setup-ninja: no pinned Ninja for $RUNNER_OS-$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        python=$(command -v python3 || command -v python)
        dir="$RUNNER_TEMP/ninja-1.13.2"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/$asset" "https://github.com/ninja-build/ninja/releases/download/v1.13.2/$asset"
        # Python for the digest and the unpacking: the same commands on every runner OS.
        "$python" - "$dir/$asset" "$sum" "$dir" <<'PY'
        import hashlib, pathlib, sys, zipfile
        archive, expected, target = pathlib.Path(sys.argv[1]), sys.argv[2], pathlib.Path(sys.argv[3])
        actual = hashlib.sha256(archive.read_bytes()).hexdigest()
        if actual != expected:
            raise SystemExit(f'setup-ninja: {archive.name} has sha256 {actual}, expected {expected}')
        with zipfile.ZipFile(archive) as zf:
            names = zf.namelist()
            if sorted(names) not in (['ninja'], ['ninja.exe']):
                raise SystemExit(f'setup-ninja: unexpected members {names}')
            zf.extractall(target)
        PY
        chmod +x "$dir/ninja" 2>/dev/null || true
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/ninja" --version
