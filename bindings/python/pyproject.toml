[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ducktape-laya"
version = "0.3.0"
description = "Local Laya GGUF decisions (choice, noul, score) through the ducktape-laya native library"
readme = "README.md"
# As the released wheels (scripts/python_wheel.py), which bundle the library with its Apache-2.0 language data;
# tests/packaging-identity.py checks that the two agree.
license = "MIT AND Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Source = "https://github.com/adrian729/ducktape-laya"

[tool.setuptools.package-data]
ducktape_laya = ["_native/*.so", "_native/*.dylib", "_native/*.dll"]
