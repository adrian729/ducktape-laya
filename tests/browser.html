<!doctype html><meta charset="utf-8"><title>Laya browser conformance</title>
<script type="module">
import { Laya } from '/browser/index.mjs';
window.state = { status: 'ready' };
window.start = async (backend = 'wasm', fixtures = ['batch', 'primitive', 'structured']) => {
  window.state = { status: 'running', backend, results: {}, timings_ms: {}, events: [], ticks: 0, gpuGraphs: 0,
    model_sha256: 'c06528c5746d3bb8baa72a27938be95abbfd0b226f8471e8a9e365ed0bb066d2', fixture_hashes: {} };
  const timer = setInterval(() => window.state.ticks++, 20);
  let engine;
  try {
    engine = await Laya.open({ backend, modelUrl: '/model.gguf', moduleUrl: '/wasm/laya.mjs', webgpuModuleUrl: '/webgpu/laya.mjs',
      onDiagnostic: text => { if (text.includes('ggml_backend_webgpu_graph_compute')) window.state.gpuGraphs++; },
      sha256: 'c06528c5746d3bb8baa72a27938be95abbfd0b226f8471e8a9e365ed0bb066d2', initializationTimeoutMs: 240000 });
    window.state.capabilities = engine.capabilities;
    window.state.info = await engine.info();
    if (window.state.info.numerical_profile.id !== (backend === 'wasm' ? 'wasm-cpu' : 'webgpu') ||
        window.state.info.numerical_profile.cross_profile_equivalence !== false) throw new Error('Invalid numerical profile');
    if (window.state.info.model.decision_type !== 'laya') throw new Error('Missing model diagnostics');
    for (const name of fixtures) {
      const request = await (await fetch(`/fixtures/${name}.json`)).text();
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(request));
      window.state.fixture_hashes[name + '.json'] = Array.from(new Uint8Array(digest), x => x.toString(16).padStart(2, '0')).join('');
      const began = performance.now();
      window.state.results[name + '.json'] = await engine.execute(request, { onEvent: event => window.state.events.push(event) });
      window.state.timings_ms[name + '.json'] = performance.now() - began;
    }
    try { await engine.execute('{}'); throw new Error('Invalid request accepted'); }
    catch (error) { if (error.status !== 1) throw error; }
    await engine.close();
    try { await engine.execute('{}'); throw new Error('Closed handle accepted'); }
    catch (error) { if (!error.message.includes('closed')) throw error; }
    window.state.status = 'passed';
  } catch (error) { window.state.status = 'failed'; window.state.error = error.stack; }
  finally { clearInterval(timer); if (engine) await engine.close().catch(() => {}); }
};
window.startControls = async (backend = 'webgpu') => {
  window.controls = { status: 'running', backend, checks: [] };
  const check = name => window.controls.checks.push(name);
  const expectStatus = async (promise, status) => {
    try { await promise; throw new Error('Expected status ' + status); }
    catch (error) { if (error.status !== status) throw error; }
  };
  const options = { backend, modelUrl: '/model.gguf', moduleUrl: '/wasm/laya.mjs', webgpuModuleUrl: '/webgpu/laya.mjs', initializationTimeoutMs: 240000 };
  let engine;
  try {
    const abort = new AbortController(); abort.abort();
    try { await Laya.open({ ...options, signal: abort.signal }); throw new Error('Accepted aborted init'); }
    catch (error) { if (error.status !== 5) throw error; }
    check('aborted initialization');
    try { await Laya.open({ ...options, maxModelBytes: 1 }); throw new Error('Ignored byte budget'); }
    catch (error) { if (error.status !== 1 || !error.message.includes('maxModelBytes')) throw error; }
    check('asset budget');
    engine = await Laya.open({ ...options, maxPending: 1 });
    const request = { state: 'Please refund me.', questions: { refund: { type: 'noul', instructions: 'Is a refund requested?' } } };
    await expectStatus(engine.execute(request, { signal: abort.signal }), 5); check('pre-cancellation');
    await expectStatus(engine.execute(request, { timeoutMs: 1 }), 6); check('deadline');
    // Host rejection can precede the worker acknowledgment. Draining close proves cleanup.
    await engine.close({ cancelPending: true }); check('cancelled close');
    engine = await Laya.openRouter({ a: { url: '/model.gguf' }, b: { url: '/model.gguf' } }, { ...options, maxModelBytes: 449397600, maxLoaded: 1 });
    const events = [];
    const result = await engine.execute([{ ...request, model: 'a' }, { ...request, model: 'b' }], { onEvent: e => events.push(e) });
    if (JSON.stringify(result[0].answers) !== JSON.stringify(result[1].answers) || result[0].model !== 'a' || result[1].model !== 'b') throw new Error('Alias router result changed');
    if (events.filter(e => e.event === 'end').length !== 1) throw new Error('Missing observer end');
    check('routing and asset deduplication');
    const first = engine.close(); if (first !== engine.close()) throw new Error('close not idempotent'); await first;
    check('idempotent shutdown');
    // Force a failed GPU initialization, then validate explicit automatic CPU fallback.
    engine = await Laya.open({ ...options, backend: 'auto', webgpuModuleUrl: '/missing.mjs' });
    if (engine.capabilities.backend !== 'wasm') throw new Error('Fallback not selected');
    await expectStatus(engine.execute(request, { timeoutMs: 1 }), 6);
    check('WASM fallback and deadline');
    await engine.close(); window.controls.status = 'passed';
  } catch (error) { window.controls.status = 'failed'; window.controls.error = error.stack; }
  finally { if (engine) await engine.close({ cancelPending: true }).catch(() => {}); }
};
window.startReference = async (backend = 'webgpu') => {
  window.reference = { status: 'running', backend };
  // Every fixture request as literal JSON text; structured ones as schema-derived primitive questions.
  const requests = await (await fetch('/reference-requests.json')).json();
  const worker = new Worker('/reference-worker.mjs', { type: 'module' });
  worker.onmessage = ({ data }) => { if (data.progress) window.reference.progress = data.progress; else { window.reference = data; worker.terminate(); } };
  worker.onerror = event => { window.reference = { status: 'failed', error: event.message }; worker.terminate(); };
  worker.postMessage({ backend, requests });
};
window.startDeviceLoss = async () => {
  window.loss = { status: 'running' };
  let engine, worker;
  const OriginalWorker = globalThis.Worker;
  globalThis.Worker = class extends OriginalWorker { constructor(...args) { super(...args); worker = this; } };
  try {
    const pending = Laya.open({ backend: 'webgpu', modelUrl: '/model.gguf', webgpuModuleUrl: '/webgpu/laya.mjs', workerUrl: '/lost-worker.mjs' });
    globalThis.Worker = OriginalWorker;
    engine = await pending;
    window.loss.phase = 'executing';
    const request = await (await fetch('/fixtures/batch.json')).json();
    const running = engine.execute(request);
    setTimeout(() => worker.postMessage({ kind: 'cancel', id: -1, testDestroy: true }), 10);
    try { await running; throw new Error('Device loss did not reject work'); }
    catch (error) { if (error.status !== 3) throw error; }
    try { await engine.execute(request); throw new Error('Failed worker reused'); }
    catch (error) { if (!error.message.includes('closed')) throw error; }
    window.loss = { status: 'passed', errorStatus: 3, reuseRejected: true };
  } catch (error) { window.loss = { status: 'failed', error: error.stack }; }
  finally { globalThis.Worker = OriginalWorker; if (engine) await engine.close().catch(() => {}); }
};
// WebGPU buffers the device cannot create (injected by /gpu-memory-worker.mjs) fail the
// operation with a native status instead of ending the worker: opening rejects with
// status 2; a router request that loads a model rejects with status 2 and the same
// engine, worker and GPU device keep answering unchanged.
window.startGpuMemory = async () => {
  window.gpuMemory = { status: 'running', checks: [] };
  const OriginalWorker = globalThis.Worker;
  let worker, failure;
  const options = { backend: 'webgpu', webgpuModuleUrl: '/webgpu/laya.mjs', workerUrl: '/gpu-memory-worker.mjs', initializationTimeoutMs: 240000,
    onDiagnostic: text => { if (text.startsWith('test: failed buffer')) failure = text; } };
  const request = { state: 'Please refund me.', questions: { refund: { type: 'noul', instructions: 'Is a refund requested?' } } };
  // `stage` is the native message of the step that must fail: the failed buffer must belong to it
  // (weights fail model loading, the compute buffer fails creating the inference context).
  const expectFailure = async (name, promise, stage) => {
    try { await promise; throw new Error('Unexpected success: ' + name); }
    catch (error) {
      if (error.message.startsWith('Unexpected success')) throw error;
      if (!failure) throw new Error(`${name}: no buffer failure was injected (${error.message})`);
      if (error.status !== 2 || error.code) throw new Error(`${name}: expected status 2, got ${error.status} ${error.code ?? ''}: ${error.message}`);
      if (stage && !error.message.includes(stage)) throw new Error(`${name}: the failed buffer (${failure}) did not fail ${JSON.stringify(stage)}: ${error.message}`);
      window.gpuMemory.checks.push({ case: name, injected: failure, status: error.status, error: error.message });
      failure = undefined;
    }
  };
  let router;
  try {
    // The arming message precedes initialization in the worker's queue.
    const loading = 'Could not load local GGUF model', context = 'Could not create the inference context';
    for (const [name, label, skip, stage] of [['model weights', 'tensor_buf', 0, loading], ['inference buffers', 'tensor_buf', 1, context],
      ['backend state', 'ggml_webgpu_param_arena', 0]]) {
      globalThis.Worker = class extends OriginalWorker {
        constructor(...args) { super(...args); this.postMessage({ kind: 'cancel', id: -1, testFailBuffer: { label, skip } }); }
      };
      try { await expectFailure('open: ' + name, Laya.open({ ...options, modelUrl: '/model.gguf' }), stage); }
      finally { globalThis.Worker = OriginalWorker; }
    }
    globalThis.Worker = class extends OriginalWorker { constructor(...args) { super(...args); worker = this; } };
    try { router = await Laya.openRouter({ a: { url: '/model.gguf' }, b: { url: '/model.gguf', contextTokens: 256 } }, { ...options, maxLoaded: 1 }); }
    finally { globalThis.Worker = OriginalWorker; }
    const expected = JSON.stringify((await router.execute({ ...request, model: 'a' })).answers);
    worker.postMessage({ kind: 'cancel', id: -1, testFailBuffer: { label: 'tensor_buf', skip: 0 } });
    await expectFailure('router request loading a model', router.execute({ ...request, model: 'b' }), loading);
    const again = JSON.stringify((await router.execute({ ...request, model: 'a' })).answers);
    if (again !== expected) throw new Error(`Answers changed after a failed allocation: ${again} != ${expected}`);
    await router.execute({ ...request, model: 'b' });
    window.gpuMemory.checks.push({ case: 'same router keeps answering after the failure', answers: JSON.parse(again) });
    await router.close(); router = undefined;
    const engine = await Laya.open({ ...options, workerUrl: undefined, onDiagnostic: undefined, modelUrl: '/model.gguf' });
    const answers = JSON.stringify((await engine.execute(request)).answers);
    await engine.close();
    if (answers !== expected) throw new Error(`Answers differ in a new engine: ${answers} != ${expected}`);
    window.gpuMemory.checks.push({ case: 'new engine after the failures' });
    window.gpuMemory.status = 'passed';
  } catch (error) { window.gpuMemory.status = 'failed'; window.gpuMemory.error = error.stack; }
  finally { globalThis.Worker = OriginalWorker; if (router) await router.close().catch(() => {}); }
};
window.startAssets = async () => {
  window.assets = { status: 'running', checks: [] };
  try {
    for (const [options, expected] of [
      [{ modelUrl: '/missing-model.gguf' }, 'HTTP 404'],
      [{ modelUrl: '/fixtures/primitive.json', sha256: '0'.repeat(64) }, 'SHA-256 mismatch'],
      [{ modelUrl: '/fixtures/primitive.json' }, 'Could not load'],
      [{ modelUrl: '/faults/truncated.gguf' }, 'Could not load'],
      [{ modelUrl: '/faults/interrupted.gguf' }, ''],
      [{ modelUrl: '/model.gguf', backend: 'wasm', moduleUrl: '/missing-module.mjs' }, ''],
      [{ modelUrl: '/model.gguf', backend: 'wasm', wasmUrl: '/fixtures/primitive.json' }, ''],
    ]) {
      const label = expected || JSON.stringify(options);
      try { const engine = await Laya.open({ initializationTimeoutMs: 240000, ...options }); await engine.close(); throw new Error('Unexpected initialization success: ' + label); }
      catch (error) {
        if (error.message.startsWith('Unexpected initialization success') || !error.message.includes(expected)) throw error;
        window.assets.checks.push({ case: label, error: error.message });
      }
    }
    // The page still opens a working engine after every failed initialization.
    const engine = await Laya.open({ modelUrl: '/model.gguf', backend: 'wasm' });
    await engine.execute({ state: 'Please refund me.', questions: { refund: { type: 'noul', instructions: 'Is a refund requested?' } } });
    await engine.close();
    window.assets.checks.push({ case: 'recovery after failed initialization' });
    window.assets.status = 'passed';
  } catch (error) { window.assets.status = 'failed'; window.assets.error = error.stack; }
};
// A WASM build whose memory ceiling is below what an engine needs: initialization must
// reject (native status, or the binding's error for an aborted runtime), never hang
// or succeed, and the page must then open a working engine with the product build.
window.startMemory = async () => {
  window.memory = { status: 'running', checks: [] };
  try {
    const build = await (await fetch('/constrained/laya.build.json')).json();
    window.memory.maximum_memory = build.maximum_memory;
    if (!(build.maximum_memory < 4294967296)) throw new Error('Not a constrained build');
    const request = { state: 'Please refund me.', questions: { refund: { type: 'noul', instructions: 'Is a refund requested?' } } };
    const options = { backend: 'wasm', moduleUrl: '/constrained/laya.mjs', initializationTimeoutMs: 240000 };
    try {
      const engine = await Laya.open({ ...options, modelUrl: '/model.gguf' });
      await engine.close(); throw new Error('Unexpected initialization success');
    } catch (error) {
      if (error.message === 'Unexpected initialization success') throw error;
      window.memory.checks.push({ case: 'engine initialization', status: error.status ?? null, error: error.message });
    }
    // Routers load lazily: the first routed request loads the model and must reject.
    let router;
    try {
      router = await Laya.openRouter({ a: { url: '/model.gguf' } }, options);
      await router.execute({ ...request, model: 'a' }); throw new Error('Unexpected routed success');
    } catch (error) {
      if (error.message === 'Unexpected routed success') throw error;
      window.memory.checks.push({ case: 'router first request', status: error.status ?? null, error: error.message });
    } finally { if (router) await router.close().catch(() => {}); }
    const engine = await Laya.open({ modelUrl: '/model.gguf', backend: 'wasm' });
    await engine.execute(request);
    await engine.close();
    window.memory.checks.push({ case: 'recovery with the product build' });
    window.memory.status = 'passed';
  } catch (error) { window.memory.status = 'failed'; window.memory.error = error.stack; }
};
</script>
